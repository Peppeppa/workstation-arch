---
# Host-specific overrides for the ThinkPad laptop.
# Real deviations only, each measured on this machine (ThinkPad T440p,
# i7-4712MQ, Intel HD 4600 / Haswell, 14" 1920x1080 eDP panel - see the
# Stage 0 hardware audit), not invented ahead of time.
#
# Gaming (opt-in host capability, group_vars gaming_enabled: false): on, the
# user's decision 2026-10-15. GPU = Intel HD 4600 (Haswell, Gen7.5 - measured,
# see above): Mesa's Vulkan driver for it (hasvk) is in vulkan-intel; the
# 32-bit one for Steam in lib32-vulkan-intel (multilib - enabled by local.yml
# for gaming hosts). Haswell's Vulkan is not conformant: older/lighter games
# and GeForce NOW (browser) are the realistic use - not validated here yet.
gaming_enabled: true
gaming_gpu_vulkan_packages:
  - vulkan-intel
  - lib32-vulkan-intel

# Haswell: VA-API through the i965 driver - intel-media-driver starts at
# Broadwell (see roles/graphics/defaults/main.yml).
# Recovery: Btrfs-on-LUKS2 root as @ with systemd-boot + UKI (Stage 0
# audit) - docs/recovery-design.md.
recovery_enabled: true

# This laptop is the physical test machine and is deployed/validated over
# SSH (key-only) - a productive laptop would leave this at false.
ssh_server_enabled: true

graphics_vaapi_packages:
  - libva-intel-driver

# The internal panel explicitly at scale 1 (conservative start, decided on
# the real screen - "auto" guesses from the reported physical size); any
# other output keeps the generic preferred/auto rule.
hyprland_monitors:
  - output: eDP-1
    mode: preferred
    position: "0x0"   # quoted: YAML 1.1 reads a bare 0x0 as the hex number 0
    scale: 1
  - output: ""
    mode: preferred
    position: auto
    scale: auto

# THWS student VPN (the user's university; group_vars fortinet_vpn_enabled).
fortinet_vpn_enabled: true
