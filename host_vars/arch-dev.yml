---
# Host-specific overrides for arch-dev, the disposable VirtualBox
# validation VM (see AGENTS.md VM / Hardware Separation - arch-dev is
# not a long-term product host and gets no invented deltas). This file
# exists for exactly one real, persistent reason, not a guess ahead of
# need: real-hardware testing confirmed that arch-dev's guest Hyprland
# session shares input with a host machine that also runs a SUPER-based
# Hyprland session, so SUPER-modifier keybinds inside the guest are
# consumed by the host before VirtualBox delivers them to the VM. This
# is specific to testing inside this VM, not a host_vars-worthy real
# deviation of laptop/workstation (they run standalone, not nested under
# another Hyprland session).
#
# ALT (the classic Hyprland modifier, same kind as SUPER/SHIFT/CTRL) is
# used here, not a left/right-specific keysym like Alt_R: an earlier
# version of this file used Alt_R, but real runtime testing showed
# Hyprland's keysym-based modkey syntax (see
# https://wiki.hypr.land/Configuring/Basics/Binds/#binding-modkeys-only)
# rejects this project's combined binds (mainMod + SHIFT + <key>, mainMod
# + <workspace number>) with "Modifiers must come first in the list" /
# "Cannot combine special syms" - that syntax is only for standalone or
# keysym-plus-keysym binds, not for combining with classic modifiers.
# ALT is a classic modifier bit, so it combines exactly like SUPER does
# everywhere in hyprland.lua.j2, with no special-casing. The host's own
# session has no normal Alt-based keybindings, so ALT (triggered by
# Left Alt) is free to use here.
hyprland_main_modifier: ALT

# Real, VM-specific deviation #2 (same "no invented deltas" rule as
# above): real testing on arch-dev showed `hyprctl monitors -j`
# reporting physicalWidth/physicalHeight: 0 for VirtualBox's virtual
# display, which makes hyprland.lua.j2's default scale = "auto" (see
# roles/hyprland/defaults/main.yml hyprland_monitor_scale) mis-detect
# scale 2 for the 1280x800 output instead of 1 - this is what made the
# whole session render far too large, including Thunar windows larger
# than the visible VM area. laptop/workstation report real physical
# monitor dimensions and keep the default "auto".
hyprland_monitor_scale: 1

# Real, VM-specific deviation #3: real testing on arch-dev showed
# Ghostty (hyprland_terminal default, see
# roles/hyprland/defaults/main.yml) failing to start with
# `Gdk: Error flushing display: Broken pipe`. Root cause confirmed with
# `GSK_RENDERER=cairo ghostty`: "loaded OpenGL 4.1" / "OpenGL version is
# too old. Ghostty requires OpenGL 4.3" - VirtualBox's 3D-accelerated
# OpenGL only exposes 4.1. `LIBGL_ALWAYS_SOFTWARE=1 ghostty` confirmed
# working (loaded OpenGL 4.6 via Mesa's software rasterizer, Ghostty
# actually started its shell subprocess) - forcing software rendering
# for Ghostty specifically is an accepted VM-only trade-off, not a
# permanent laptop/workstation choice (they have real GPUs that meet
# Ghostty's OpenGL 4.3 requirement, so keep the default `ghostty`
# there). Known gap: this only fixes the mainMod+Return keybind: the
# Quickshell launcher (roles/quickshell/files/quickshell/Launcher.qml)
# launches entries via their own unmodified .desktop Exec= line, so
# launching Ghostty from the launcher still fails the same way on
# arch-dev - accepted for this disposable test VM (see AGENTS.md VM /
# Hardware Separation), not fixed here.
hyprland_terminal: "env LIBGL_ALWAYS_SOFTWARE=1 ghostty"

# Real, VM-specific deviation #4, same mechanism/root cause as #3
# above: real testing on arch-dev showed Quickshell (roles/quickshell)
# starting via hl.exec_cmd (both at hyprland.start and via a controlled
# manual hl.exec_cmd() test afterward, so this is not a startup-timing
# issue) but never staying up. Captured stderr (the default spawn
# redirects it to /dev/null, so this needed a wrapper that redirects it
# back) showed the actual failure:
#   wl_display#1: error 1: invalid arguments for wl_surface#47.attach
#   WARN: The Wayland connection experienced a fatal error: Invalid argument
# i.e. Quickshell's QtQuick scene graph tries to attach a
# GPU-accelerated buffer the moment it renders its first frame (the bar
# window), and VirtualBox's 3D-accelerated OpenGL driver produces a
# buffer Hyprland's Wayland compositor rejects as malformed - the exact
# same VirtualBox-GPU-driver failure class already fixed for Ghostty
# above (confirmed via its own "OpenGL version is too old" error) and
# previously documented, but left unfixed, for zathura/imv in AGENTS.md.
# `env LIBGL_ALWAYS_SOFTWARE=1 quickshell` confirmed working on
# arch-dev: process stayed running past the point it previously died,
# and `hyprctl layers` showed a real 1280x28 "quickshell" layer-shell
# surface actually on screen. laptop/workstation have real GPUs and
# keep the default `quickshell` (see hyprland_quickshell_cmd in
# roles/hyprland/defaults/main.yml).
hyprland_quickshell_cmd: "env LIBGL_ALWAYS_SOFTWARE=1 quickshell"

# hyprlock (spawned by hypridle, inheriting its environment) hits the same
# VirtualBox `wl_surface.attach` failure as Ghostty/Quickshell above:
# real arch-dev test - plain hyprlock aborted ("invalid arguments for
# wl_surface#18.attach", core dumped, session never locked);
# `LIBGL_ALWAYS_SOFTWARE=1 hyprlock` locked and rendered correctly.
# Applied to hypridle so every hyprlock it starts gets it.
lock_idle_hypridle_cmd: "env LIBGL_ALWAYS_SOFTWARE=1 hypridle"

# Real, VM-specific deviation #5: visual acceptance of the desktop at
# 2560x1440 (the real hosts' target size class) inside this VM.
# VirtualBox's vmwgfx connector does not list 2560x1440 (its fixed table
# has 2560x1600, 2048x1152, 1920x1080, ...; the preferred mode follows
# the VM window size, 1280x800 here), so "preferred" can never reach it.
# Hyprland sets an unlisted mode as a custom mode; verified on arch-dev
# (`hyprctl monitors`: Virtual-1 2560x1440@60, scale 1; bar 2560x26,
# wallpaper surface 2560x1440). No modeline, no VirtualBox-side hint -
# just the existing monitor list with an explicit mode, for this VM only.
hyprland_monitors:
  - output: ""
    mode: "2560x1440@60"
    position: auto
    scale: "{{ hyprland_monitor_scale }}"
