---
# Host-specific overrides for the desktop workstation.
# Real deviations (different GPU, different power
# policy, ...) land here once they are actually needed, not invented
# ahead of time.
#
# Gaming (opt-in host capability, group_vars gaming_enabled: false): on, the
# user's decision 2026-10-15. GPU: Intel (iGPU/Arc - stated by the user, not
# yet measured on the machine) -> Mesa's Intel Vulkan driver, 64- and 32-bit
# (lib32-: multilib, enabled by local.yml for gaming hosts). Check with
# `lspci -k | grep -A3 VGA` at the bring-up; a different GPU changes this list.
gaming_enabled: true
gaming_gpu_vulkan_packages:
  - vulkan-intel
  - lib32-vulkan-intel

# Real deviation: no battery, mains-powered desktop - the battery widget
# (and with it the bar's profile switch) never shows here, so the
# preferred profile is set at provisioning: performance, applied once by
# roles/power (only if power-profiles-daemon offers it on this platform;
# a later `powerprofilesctl set ...` is never reset).
power_profile_default: performance

# THWS student VPN (the user's university; group_vars fortinet_vpn_enabled).
fortinet_vpn_enabled: true
