---
# Host-specific overrides for the desktop workstation.
# Real deviations (different GPU, different power
# policy, ...) land here once they are actually needed, not invented
# ahead of time.
#
# Gaming is opt-in (gaming_enabled: false by default - see
# group_vars/all.yml and AGENTS.md). This host's real GPU is not yet
# documented here, so gaming stays disabled rather than guessed. Once
# the real GPU is known, enable both together, e.g.:
#   gaming_enabled: true
#   gaming_gpu_vulkan_packages: [vulkan-radeon, lib32-vulkan-radeon]

# Real deviation: no battery, mains-powered desktop - the battery widget
# (and with it the bar's profile switch) never shows here, so the
# preferred profile is set at provisioning: performance, applied once by
# roles/power (only if power-profiles-daemon offers it on this platform;
# a later `powerprofilesctl set ...` is never reset).
power_profile_default: performance
