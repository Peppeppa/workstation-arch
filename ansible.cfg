[defaults]
inventory = inventory/localhost.yml
interpreter_python = auto_silent
retry_files_enabled = False
nocows = 1
# Failure diagnostics only (a successful run looks the same): results as
# readable YAML (multi-line stdout/stderr/msg instead of one escaped JSON
# line) and the failing task's file:line.
callback_result_format = yaml
show_task_path_on_failure = True
