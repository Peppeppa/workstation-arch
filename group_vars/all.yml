---
# Shared defaults for every host.
#
# This file is also the source of truth for optional FEATURE flags
# (see docs/feature-architecture.md for the full model/contract). Each
# feature is one flat `<name>_enabled: true|false` boolean here - the
# single place to check or change whether it's on, same convention
# `gaming_enabled` below already established before this was named a
# pattern. A feature's own packages/config/keybinds stay next to its
# existing implementation (its role's defaults/tasks, hyprland.lua.j2,
# ...) gated by `when: <name>_enabled` / `{% if %}` - this file never
# grows role-specific detail, only the flag and a one-line pointer to
# where the feature actually lives.

# Screenshots (mainMod+X smart region/window capture -> PNG file +
# clipboard, see roles/desktop's screenshot.sh and the binds in
# roles/hyprland/templates/hyprland.lua.j2). Already-working daily-
# driver functionality, so it defaults to true (unlike gaming below,
# which needs host-specific hardware facts this project will not
# guess). Set to false on a host to stop installing grim/slurp/the
# helper and remove the binds; already-installed packages and existing
# screenshots are left alone (see docs/feature-architecture.md
# "Disable vs. Purge" - disabling never deletes anything).
screenshots_enabled: true

# Screenshot OCR (mainMod+Shift+X: select region/window -> local
# tesseract OCR (deu+eng) -> recognized text to clipboard, no PNG kept).
# DEPENDS ON screenshots_enabled - it reuses that feature's helper and
# grim/slurp; with screenshots_enabled: false this flag has no effect.
# Fully local, no network, zero idle cost (tesseract only runs per
# keypress). false drops the bind and stops installing tesseract.
screenshots_ocr_enabled: true

# Power menu (mainMod+Escape: Quickshell overlay with Lock (shown as
# unavailable until a lockscreen exists), Suspend, Hibernate (only where
# logind reports it available), Logout, Reboot, Shutdown - each runs
# immediately, no confirm step). Lives in roles/quickshell (PowerMenu.qml,
# composed by shell.qml.j2) + the bind in hyprland.lua.j2. No extra
# process: part of the running Quickshell instance, no privileges
# beyond logind's normal active-session rules. false drops the bind and
# the component; nothing is deleted.
power_menu_enabled: true

# Lock + idle (hyprlock + hypridle, roles/hyprland). Super+L and the
# power menu's Lock both run `loginctl lock-session`; after
# lock_idle_lock_timeout (5 min) idle the session locks, after
# lock_idle_dpms_timeout (10 min) the displays go off; the session is
# always locked before suspend/hibernate. Adds exactly one persistent
# process (hypridle, started by Hyprland); hyprlock runs only while
# locked. false: no bind, power menu Lock unavailable again, hypridle
# stopped, its two feature-owned configs removed - nothing else deleted.
lock_idle_enabled: true

# Notifications (roles/quickshell Notifications.qml, composed by
# shell.qml.j2): Quickshell's own NotificationServer owns
# org.freedesktop.Notifications inside the running Quickshell - toasts
# top-right, no history/center/sound. mako is retired (roles/desktop)
# regardless of this flag, so false means: no notification daemon at
# all (notify-send then just fails quietly). Nothing is persisted.
notifications_enabled: true

# System tray (roles/quickshell files/tray/, loaded by Bar.qml): Quickshell's
# native StatusNotifierItem host - the running Quickshell process becomes
# the session's StatusNotifierWatcher and shows registered items in the
# bar's status zone (DBusMenu context menus rendered with Colors/Fonts).
# Event-driven over D-Bus, no extra process. false: the tray component is
# never instantiated (no watcher/host from us); nothing to delete.
tray_enabled: true

# Bluetooth (roles/bluetooth: bluez + bluetooth.service; roles/quickshell
# files/bluetooth/: bar slot + popup + on-demand pairing agent). Quickshell's
# native Bluetooth module drives everything over BlueZ D-Bus (power,
# scan, connect, pair, forget); the pairing agent runs only while the user
# pairs. bluetoothd is the one new permanent (system) process. false:
# no UI, bluetooth.service disabled+stopped; pairings in /var/lib/bluetooth
# and packages stay.
bluetooth_enabled: true

# Power profiles (roles/power: power-profiles-daemon; roles/quickshell
# files/power/: power popup with battery details + Performance/Balanced/
# Power Saver - only the profiles the hardware offers). Switching is
# PPD's D-Bus property via Quickshell, event-driven, no sudo. The battery
# indicator and the low-battery warning are core and independent of this.
# false: no popup/profile icon, PPD disabled+stopped.
power_profiles_enabled: true

# Audio popup (roles/quickshell files/audio/): right click on the bar's
# volume opens output/input device selection (default sink/source),
# volume and mute for both, plus a mic-muted icon in the bar while the
# default input is muted. Quickshell's native PipeWire API; PipeWire/
# WirePlumber stay core (roles/audio). The volume label itself (left
# click mute, wheel) is core. false: no popup, no mic icon.
audio_popup_enabled: true

# Connectivity Center (roles/quickshell files/connectivity/): click on the
# bar's network label opens Wi-Fi (on/off, networks, connect/disconnect/
# forget, password entry), an on-demand Wi-Fi QR code for the current
# network, a Bluetooth section (with bluetooth_enabled; opens the
# Bluetooth popup) and NetworkManager VPN/WireGuard connections.
# NetworkManager stays the only network owner (roles/network). false: no
# popup, the network label stays.
connectivity_enabled: true

# Clipboard history (cliphist): Hyprland's session start runs one watcher
# (`wl-paste --type text --watch cliphist store`, text only; content
# marked sensitive by password managers is not stored), mainMod+V opens
# the Quickshell history popup (search, select = copy, delete, clear).
# Stored in ~/.cache/cliphist/db, at most clipboard_history_max_items
# entries (roles/hyprland/defaults). false: watcher stopped, no bind/
# popup; the existing history file stays (`cliphist wipe` clears it).
clipboard_history_enabled: true

# Wallpaper (roles/quickshell files/wallpaper/): Quickshell draws the
# background on every monitor from the active theme's backgrounds/
# (themes/<id>/backgrounds/*.png|jpg|jpeg|webp|gif - the directory is the
# list). Pick in the theme dialog (right click on the theme icon); the
# choice is remembered per theme by the `theme` helper (runtime state in
# ~/.config/workstation/theme-state, never reset by bootstrap). Default:
# first file in sorted order; none: the theme's background color. GIFs
# play animated (only while selected). false: Hyprland's own default
# wallpaper, no picker.
wallpaper_enabled: true

# Theme selection - core presentation, not a feature flag: the desktop
# always has colors. Themes are directories in themes/<id>/ (see
# docs/DESIGN_SYSTEM.md "Themes"). These are only the INITIAL values: the
# user's live choice is ~/.config/workstation/theme-state (set from the
# bar), which bootstrap.sh creates from these if missing and otherwise
# never overwrites. Hosts may override the initial values in host_vars.
theme_dark: retro-82          # initial dark theme id
theme_light: rose-pine-dawn   # initial light theme id
theme_mode: dark              # initial mode: dark | light

# Typography roles - core presentation, not a feature flag. The one
# place font names live (exact fontconfig family names, verified with
# fc-scan/fc-list, not guessed):
#   ui        -> GTK interface font + fontconfig sans-serif (roles/desktop)
#   shell     -> our own shell surfaces: Quickshell Fonts.family,
#                hyprlock (roles/quickshell, roles/hyprland)
#   monospace -> fontconfig monospace, GTK monospace, Ghostty
#   icon      -> Nerd Font icon glyphs next to text (Quickshell Fonts.icons)
desktop_ui_font_family: "Adwaita Sans"
desktop_ui_font_size: 11                                  # GTK, pt
desktop_shell_font_family: "FiraCode Nerd Font"
desktop_monospace_font_family: "FiraCode Nerd Font Mono"
desktop_icon_font_family: "FiraCode Nerd Font Propo"

# Icon theme Quickshell (Qt, no platform theme here) resolves icon NAMES
# from - tray items, notification app icons. Applied as QS_ICON_THEME in
# Quickshell's start command (roles/hyprland hyprland_quickshell_exec);
# takes effect at Quickshell's next start.
desktop_icon_theme: Adwaita

# Gaming is an OPT-IN host capability, not a common-role concern (see
# AGENTS.md VM / Hardware Separation): the shared daily-driver stack
# (base/graphics/hyprland/desktop/audio/network/apps/virtualization)
# must provision cleanly on any upstream Arch host, including a
# throwaway test VM, without that host being configured for gaming.
# false is the safe default every host inherits unless a real host's
# own host_vars/<hostname>.yml explicitly sets gaming_enabled: true.
gaming_enabled: false

# Required by roles/gaming, and only meaningful once gaming_enabled is
# true for the host (Steam depends on a concrete Vulkan driver).
# Deliberately empty here: the real GPU (Intel/AMD/NVIDIA) differs per
# host and must never be guessed (see AGENTS.md "no automatic
# hardware-detection engine") - set the real value in the relevant
# host_vars/<hostname>.yml alongside gaming_enabled: true, e.g.:
#   gaming_enabled: true
#   gaming_gpu_vulkan_packages: [vulkan-intel, lib32-vulkan-intel]
#   gaming_gpu_vulkan_packages: [vulkan-radeon, lib32-vulkan-radeon]
#   gaming_gpu_vulkan_packages: [nvidia-utils, lib32-nvidia-utils]
# roles/gaming refuses to run (ansible.builtin.assert) if gaming_enabled
# is true but this is still empty for the host being provisioned.
gaming_gpu_vulkan_packages: []
