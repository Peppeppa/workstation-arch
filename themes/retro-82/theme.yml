# Theme data only - no logic (see docs/DESIGN_SYSTEM.md "Themes").
# Mode comes from the marker file next to this one (dark), never from here.
# Source: https://github.com/oldjobobo/retro-82.nvim - lua/retro82/palette.lua (v0.3.0, Base24 palette by OldJobobo; role names in comments are the author's own aliases)
# Each color: original palette name -> our semantic role.
name: "Retro 82"
colors:
  background:        "#00172E"  # base00 (bg0 / base)
  surface:           "#0A3A45"  # base02 (author alias: surface)
  foreground:        "#A7C9C6"  # base06 (author alias: text / fg0)
  foreground_strong: "#FFF1DA"  # fg1 (the palette's bright warm foreground; terminal bright_white)
  foreground_muted:  "#5F8F96"  # base05 (author alias: fg_dim) - base04 'text_muted' is too low-contrast on bg0 for UI text
  accent:            "#FAA968"  # base0A (keyword/func - the 'warm sunset' accent)
  accent_foreground: "#00172E"  # base00 - dark text on the light accent
  border:            "#2A6A73"  # base04 (author alias: border)
  border_active:     "#FAA968"  # base0A = accent
  error:             "#F85525"  # base08 (author alias: error)

# Terminal palette (ANSI 0-15). Source: lua/retro82/palette.lua M.terminal (v0.3.0) - the plugin's own terminal palette; preferred over the older extras/retro-82.ghostty from v0.1.0, which repeats colors (red = magenta)
terminal:
  black:           "#00172E"  # bg0
  red:             "#F85525"  # error
  green:           "#F6DCAC"  # string
  yellow:          "#FAA968"  # keyword
  blue:            "#5AA6A1"  # base16
  magenta:         "#FF8A6B"  # number
  cyan:            "#8CBFB8"  # support
  white:           "#5F8F96"  # base05
  bright_black:    "#134E5A"  # base03
  bright_red:      "#FF6B3D"  # base12
  bright_green:    "#19A7A8"  # success
  bright_yellow:   "#FFBE7A"  # base13
  bright_blue:     "#6FA6C8"  # base1D
  bright_magenta:  "#FFB38F"  # base1F
  bright_cyan:     "#39B5D4"  # base1C
  bright_white:    "#FFF1DA"  # fg1
