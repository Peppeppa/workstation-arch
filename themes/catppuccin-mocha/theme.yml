# Theme data only - no logic (see docs/DESIGN_SYSTEM.md "Themes").
# Mode comes from the marker file next to this one (dark), never from here.
# Source: https://github.com/catppuccin/palette - palette.json, flavor mocha
# Each color: original palette name -> our semantic role.
name: "Catppuccin Mocha"
colors:
  background:        "#1e1e2e"  # base
  surface:           "#181825"  # mantle
  foreground:        "#cdd6f4"  # text
  foreground_strong: "#cdd6f4"  # text (already the palette's brightest text tone)
  foreground_muted:  "#a6adc8"  # subtext0
  accent:            "#89b4fa"  # blue
  accent_foreground: "#1e1e2e"  # base
  border:            "#45475a"  # surface1
  border_active:     "#89b4fa"  # blue = accent
  error:             "#f38ba8"  # red

# Terminal palette (ANSI 0-15). Source: catppuccin/ghostty themes/catppuccin-mocha.conf (palette 0-15)
terminal:
  black:           "#45475a"  # surface1
  red:             "#f38ba8"  # red
  green:           "#a6e3a1"  # green
  yellow:          "#f9e2af"  # yellow
  blue:            "#89b4fa"  # blue
  magenta:         "#f5c2e7"  # pink
  cyan:            "#94e2d5"  # teal
  white:           "#a6adc8"  # subtext0
  bright_black:    "#585b70"  # surface2
  bright_red:      "#f38ba8"  # red
  bright_green:    "#a6e3a1"  # green
  bright_yellow:   "#f9e2af"  # yellow
  bright_blue:     "#89b4fa"  # blue
  bright_magenta:  "#f5c2e7"  # pink
  bright_cyan:     "#94e2d5"  # teal
  bright_white:    "#bac2de"  # subtext1

# Neovim: the real Neovim port of this theme (the official Catppuccin port) - see the theme
# helper's "Neovim" notes. Data only: lazy.nvim plugin + colorscheme name.
neovim:
  plugin: "catppuccin/nvim"
  name: "catppuccin"
  colorscheme: "catppuccin-mocha"
