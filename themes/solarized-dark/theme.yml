# Theme data only - no logic (see docs/DESIGN_SYSTEM.md "Themes").
# Mode comes from the marker file next to this one (dark), never from here.
# Source: https://github.com/altercation/solarized - README.md (Ethan Schoonover's canonical values)
# Each color: original palette name -> our semantic role.
name: "Solarized Dark"
colors:
  background:        "#002b36"  # base03
  surface:           "#073642"  # base02
  foreground:        "#839496"  # base0 (body text)
  foreground_muted:  "#586e75"  # base01 (secondary content)
  accent:            "#268bd2"  # blue
  accent_foreground: "#fdf6e3"  # base3
  border:            "#586e75"  # base01
  border_active:     "#268bd2"  # blue = accent
  error:             "#dc322f"  # red
