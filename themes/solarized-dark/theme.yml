# Theme data only - no logic (see docs/DESIGN_SYSTEM.md "Themes").
# Mode comes from the marker file next to this one (dark), never from here.
# Source: https://github.com/altercation/solarized - README.md (Ethan Schoonover's canonical values)
# Each color: original palette name -> our semantic role.
name: "Solarized Dark"
colors:
  background:        "#002b36"  # base03
  surface:           "#073642"  # base02
  foreground:        "#839496"  # base0 (body text)
  foreground_muted:  "#586e75"  # base01 (secondary content)
  accent:            "#268bd2"  # blue
  accent_foreground: "#fdf6e3"  # base3
  border:            "#586e75"  # base01
  border_active:     "#268bd2"  # blue = accent
  error:             "#dc322f"  # red

# Terminal palette (ANSI 0-15). Source: altercation/solarized README - the canonical 16-color terminal assignment
terminal:
  black:           "#073642"  # base02
  red:             "#dc322f"  # red
  green:           "#859900"  # green
  yellow:          "#b58900"  # yellow
  blue:            "#268bd2"  # blue
  magenta:         "#d33682"  # magenta
  cyan:            "#2aa198"  # cyan
  white:           "#eee8d5"  # base2
  bright_black:    "#002b36"  # base03
  bright_red:      "#cb4b16"  # orange
  bright_green:    "#586e75"  # base01
  bright_yellow:   "#657b83"  # base00
  bright_blue:     "#839496"  # base0
  bright_magenta:  "#6c71c4"  # violet
  bright_cyan:     "#93a1a1"  # base1
  bright_white:    "#fdf6e3"  # base3
