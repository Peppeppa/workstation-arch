# Theme data only - no logic (see docs/DESIGN_SYSTEM.md "Themes").
# Mode comes from the marker file next to this one (light), never from here.
# Source: https://github.com/catppuccin/palette - palette.json, flavor latte
# Each color: original palette name -> our semantic role.
name: "Catppuccin Latte"
colors:
  background:        "#eff1f5"  # base
  surface:           "#e6e9ef"  # mantle
  foreground:        "#4c4f69"  # text
  foreground_strong: "#4c4f69"  # text (= foreground: already full contrast on a light base)
  foreground_muted:  "#6c6f85"  # subtext0
  accent:            "#1e66f5"  # blue
  accent_foreground: "#eff1f5"  # base
  border:            "#bcc0cc"  # surface1
  border_active:     "#1e66f5"  # blue = accent
  error:             "#d20f39"  # red
  success:           "#40a02b"  # green

# Terminal palette (ANSI 0-15). Source: catppuccin/ghostty themes/catppuccin-latte.conf (palette 0-15)
terminal:
  black:           "#5c5f77"  # subtext1
  red:             "#d20f39"  # red
  green:           "#40a02b"  # green
  yellow:          "#df8e1d"  # yellow
  blue:            "#1e66f5"  # blue
  magenta:         "#ea76cb"  # pink
  cyan:            "#179299"  # teal
  white:           "#acb0be"  # surface2
  bright_black:    "#6c6f85"  # subtext0
  bright_red:      "#d20f39"  # red
  bright_green:    "#40a02b"  # green
  bright_yellow:   "#df8e1d"  # yellow
  bright_blue:     "#1e66f5"  # blue
  bright_magenta:  "#ea76cb"  # pink
  bright_cyan:     "#179299"  # teal
  bright_white:    "#bcc0cc"  # surface1

# Neovim: the real Neovim port of this theme (the official Catppuccin port) - see the theme
# helper's "Neovim" notes. Data only: lazy.nvim plugin + colorscheme name.
neovim:
  plugin: "catppuccin/nvim"
  name: "catppuccin"
  colorscheme: "catppuccin-latte"
