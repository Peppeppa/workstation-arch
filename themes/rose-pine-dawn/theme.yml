# Theme data only - no logic (see docs/DESIGN_SYSTEM.md "Themes").
# Mode comes from the marker file next to this one (light), never from here.
# Source: https://github.com/rose-pine/palette - palette.json, variant dawn (the light Rosé Pine variant)
# Each color: original palette name -> our semantic role.
name: "Rosé Pine Dawn"
colors:
  background:        "#faf4ed"  # base
  surface:           "#fffaf3"  # surface
  foreground:        "#464261"  # text
  foreground_strong: "#464261"  # text (= foreground: already full contrast on a light base)
  foreground_muted:  "#797593"  # subtle
  accent:            "#286983"  # pine
  accent_foreground: "#faf4ed"  # base
  border:            "#9893a5"  # muted
  border_active:     "#286983"  # pine = accent
  error:             "#b4637a"  # love

# Terminal palette (ANSI 0-15). Source: rose-pine/ghostty dist/rose-pine-dawn (palette 0-15; white uses that repo's #575279 text tone)
terminal:
  black:           "#f2e9e1"  # overlay
  red:             "#b4637a"  # love
  green:           "#286983"  # pine
  yellow:          "#ea9d34"  # gold
  blue:            "#56949f"  # foam
  magenta:         "#907aa9"  # iris
  cyan:            "#d7827e"  # rose
  white:           "#575279"  # text
  bright_black:    "#9893a5"  # muted
  bright_red:      "#b4637a"  # love
  bright_green:    "#286983"  # pine
  bright_yellow:   "#ea9d34"  # gold
  bright_blue:     "#56949f"  # foam
  bright_magenta:  "#907aa9"  # iris
  bright_cyan:     "#d7827e"  # rose
  bright_white:    "#575279"  # text
