---
# Entry point: provisions whichever machine this is run on.
#
# Runs entirely locally (no SSH, no remote hosts). This project only
# targets two real machines (laptop, workstation) long-term, but the
# common roles below apply to any upstream Arch host unconditionally -
# an unregistered test VM is provisioned exactly like the two real
# machines. host_vars/<real hostname>.yml (loaded explicitly below) is
# entirely optional: an unknown hostname just skips it and gets the
# common roles with no overrides. See inventory/localhost.yml for why
# this isn't modeled as separate inventory hosts.
- name: Provision this workstation
  hosts: localhost
  connection: local
  become: false
  gather_facts: true

  pre_tasks:
    - name: Read the distro ID from /etc/os-release
      ansible.builtin.command:
        cmd: grep -Po '^ID=\K.*' /etc/os-release
      register: _os_release_id
      changed_when: false
      check_mode: false
      tags: always

    - name: Verify this is upstream Arch Linux, not a derivative
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Archlinux"
          - (_os_release_id.stdout | trim('"')) == "arch"
        fail_msg: >-
          workstation-arch targets upstream Arch Linux only. Detected
          ansible_distribution={{ ansible_facts.distribution }},
          /etc/os-release ID={{ _os_release_id.stdout }}. Derivatives
          such as Omarchy or CachyOS are not supported provisioning
          targets.
        success_msg: "Arch Linux confirmed (ID=arch)"
      tags: always

    - name: Load host-specific variable overrides, if any
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - files:
            - "host_vars/{{ ansible_facts.nodename }}.yml"
          skip: true
      tags: always

    # Enabling multilib is idempotent (ansible.builtin.replace only
    # substitutes an existing match, never appends, so it is a no-op on
    # a host where multilib is already enabled) and deliberately placed
    # BEFORE the always-on sync+upgrade step directly below, not inside
    # roles/gaming itself: that way the one, single pacman -Syu this
    # project ever runs per invocation (see that task's own comment)
    # already covers the newly enabled repository too, with no second
    # sync/upgrade anywhere. Tagged `gaming` (not `always`) so a run
    # that never touches gaming leaves pacman.conf untouched - no
    # invented deltas for hosts that don't need Steam/Lutris. Also
    # gated on gaming_enabled (opt-in host capability, default false -
    # see group_vars/all.yml and roles/gaming): a host that hasn't
    # opted into gaming leaves pacman.conf untouched even when
    # `--tags gaming` is explicitly requested.
    - name: Enable the multilib repository (required by roles/gaming)
      become: true
      when: gaming_enabled
      ansible.builtin.replace:
        path: /etc/pacman.conf
        regexp: '#\[multilib\]\n#Include = /etc/pacman.d/mirrorlist'
        replace: '[multilib]\nInclude = /etc/pacman.d/mirrorlist'
      tags: gaming

    # Sync + full upgrade happens exactly once here, regardless of which
    # --tags a run selects (tags: always). Roles below only ever install
    # their own package lists (state: present) - they never repeat this
    # step, so a provisioning run never does more than one full system
    # upgrade, and package-installing roles never risk a partial upgrade
    # by installing against a stale, unsynced database.
    - name: Sync package database and upgrade the system
      become: true
      community.general.pacman:
        update_cache: true
        upgrade: true
      tags: always

  roles:
    # Core: resolves the active color theme (data only) for every later
    # role's templates - always runs, see roles/theme.
    - role: theme
      tags: [always]

    - role: base
      tags: [base]

    - role: graphics
      tags: [graphics]

    - role: hyprland
      tags: [hyprland]

    - role: desktop
      tags: [desktop]

    - role: audio
      tags: [audio]

    - role: network
      tags: [network]

    # Core: nftables inbound firewall (one own table), ICMP-redirect sysctl,
    # the helper behind Settings -> Firewall. After base (sshd) so a remote
    # host's SSH rule and server exist before default-drop applies.
    - role: firewall
      tags: [firewall]

    - role: bluetooth
      tags: [bluetooth]

    # Host capability: Btrfs recovery layout, snapper, system-update/-snapshot/
    # -rollback (docs/recovery-design.md). Before power: it owns @swap.
    - role: recovery
      tags: [recovery]

    - role: power
      tags: [power]

    - role: quickshell
      tags: [quickshell]

    - role: display_manager
      tags: [display_manager]

    # Core: `repo-diagnose` (on-demand health snapshot, no daemon/timer).
    - role: diagnostics
      tags: [diagnostics]

    # Development tools (gh, lazygit, JDK, Python/uv, C/Rust/Assembly
    # toolchains) and Docker - installed, never started at boot (start/stop
    # on demand: README). Before apps: Neovim's headless Mason install there
    # builds some servers with these toolchains (asm-lsp needs cargo - found
    # on the laptop when apps ran first).
    - role: development
      tags: [development]

    - role: apps
      tags: [apps]

    # Packages menu (OS menu -> Packages): fzf picker helper + the AUR helper
    # (yay, pinned build) for the user's own runtime installs/removals.
    - role: packages
      tags: [packages]

    # Terminal tools (Starship, zoxide, fzf, eza, bat, tldr) + one sourced
    # shell integration file; personal shell config stays in the dotfiles.
    - role: shell
      tags: [shell]

    - role: virtualization
      tags: [virtualization]

    - role: gaming
      tags: [gaming]

  # After a COMPLETE run only: the host's protected recovery baseline - its
  # "known-good" slot, or (only while it has none) one pinned snapshot taken
  # once (roles/recovery recovery-baseline; changed only when it creates).
  post_tasks:
    - name: Recovery baseline after a complete provisioning (recovery_enabled)
      when: recovery_enabled
      become: true
      ansible.builtin.command:
        cmd: /usr/local/lib/workstation/recovery-baseline
      register: recovery_baseline
      changed_when: recovery_baseline.stdout is search('^created')
      tags: recovery
