---
# Entry point: provisions whichever machine this is run on.
#
# Runs entirely locally (no SSH, no remote hosts). This project only
# targets two real machines (laptop, workstation) long-term, but the
# common roles below apply to any upstream Arch host unconditionally -
# an unregistered test VM is provisioned exactly like the two real
# machines. host_vars/<real hostname>.yml (loaded explicitly below) is
# entirely optional: an unknown hostname just skips it and gets the
# common roles with no overrides. See inventory/localhost.yml for why
# this isn't modeled as separate inventory hosts.
- name: Provision this workstation
  hosts: localhost
  connection: local
  become: false
  gather_facts: true

  pre_tasks:
    - name: Read the distro ID from /etc/os-release
      ansible.builtin.command:
        cmd: grep -Po '^ID=\K.*' /etc/os-release
      register: _os_release_id
      changed_when: false
      check_mode: false
      tags: always

    - name: Verify this is upstream Arch Linux, not a derivative
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Archlinux"
          - (_os_release_id.stdout | trim('"')) == "arch"
        fail_msg: >-
          workstation-arch targets upstream Arch Linux only. Detected
          ansible_distribution={{ ansible_facts.distribution }},
          /etc/os-release ID={{ _os_release_id.stdout }}. Derivatives
          such as Omarchy or CachyOS are not supported provisioning
          targets.
        success_msg: "Arch Linux confirmed (ID=arch)"
      tags: always

    - name: Load host-specific variable overrides, if any
      ansible.builtin.include_vars: "{{ item }}"
      with_first_found:
        - files:
            - "host_vars/{{ ansible_facts.nodename }}.yml"
          skip: true
      tags: always

    # Sync + full upgrade happens exactly once here, regardless of which
    # --tags a run selects (tags: always). Roles below only ever install
    # their own package lists (state: present) - they never repeat this
    # step, so a provisioning run never does more than one full system
    # upgrade, and package-installing roles never risk a partial upgrade
    # by installing against a stale, unsynced database.
    - name: Sync package database and upgrade the system
      become: true
      community.general.pacman:
        update_cache: true
        upgrade: true
      tags: always

  roles:
    - role: base
      tags: [base]

    - role: graphics
      tags: [graphics]
