---
# Audio (minimal-usable-daily-driver milestone). PipeWire + WirePlumber
# are the sole audio owner (see AGENTS.md "one owner per
# responsibility") - no PulseAudio in parallel; pipewire-pulse
# (installed below) conflicts with the `pulseaudio` package at the
# pacman level, so pacman itself refuses to leave both installed.
audio_packages:
  - pipewire        # low-latency audio/video router - the core daemon
  - wireplumber      # session/policy manager; also provides `wpctl`,
                     # the required CLI (see AGENTS.md networking/CLI
                     # first-class rule, applied here to audio)
  - pipewire-audio   # core audio support module for pipewire
  - pipewire-pulse   # PulseAudio-compatible server socket, so
                     # PulseAudio-only client apps keep working
  - pipewire-alsa    # ALSA client compatibility (apps using ALSA
                     # directly get routed through PipeWire)
  - rtkit            # RealtimeKit: grants PipeWire/WirePlumber threads
                     # realtime scheduling priority on request, over
                     # D-Bus, so they are not stuck at the fallback
                     # nice/priority values. Listed as an optdepend of
                     # pipewire upstream, not something this project
                     # invents. Its rtkit-daemon.service is D-Bus
                     # bus-activated (upstream unit, no [Install]
                     # enablement) - installing the package is the
                     # entire fix; no Ansible service task is needed or
                     # correct here.

  # Deliberately NOT included: pipewire-jack (JACK compatibility) - no
  # concrete pro-audio/JACK workload exists yet; add it if one does.
  #
  # Deliberately NOT included: realtime-privileges - an alternative,
  # mutually redundant way to grant realtime scheduling (static
  # `realtime` group + ambient RLIMIT instead of rtkit's on-demand
  # D-Bus grants). Installing both would be two owners for the same
  # responsibility; rtkit is the one WirePlumber actually calls (see
  # the RTKit D-Bus errors this fixes), so it is the one this project
  # keeps.
