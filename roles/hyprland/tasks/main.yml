---
# Hyprland session: compositor and default terminal (Ghostty) - see
# roles/desktop for the polkit agent/portals/notifications/screenshot/
# clipboard/brightness tools and roles/quickshell for the bar/launcher
# that together make this a practically usable desktop. No display
# manager, no autostart-on-login hook. Login on a TTY and run
# `Hyprland` manually - see README.md.
#
# The once-per-run package database sync + full system upgrade lives in
# local.yml's pre_tasks (tags: always), not here - this role only
# ensures its own packages/config are present. No services are
# installed or enabled by this role.

- name: Install Hyprland session packages
  become: true
  community.general.pacman:
    name: "{{ hyprland_packages }}"
    state: present
  tags: hyprland

# fuzzel is no longer in hyprland_packages (Core Desktop v1 - roles/
# quickshell's own Launcher.qml owns this responsibility now), but
# `pacman: state: present` with a package list never removes a package
# that was installed by an earlier run and then dropped from the list -
# it would otherwise stay installed, unused, and contradicting the
# documented "Quickshell owns the launcher" ownership (see AGENTS.md
# Runtime Ownership). Explicit, one-time cleanup, not a precedent for
# a general package-removal mechanism - idempotent no-op once removed.
- name: Remove fuzzel (retired - Quickshell's Launcher.qml replaces it)
  become: true
  community.general.pacman:
    name: fuzzel
    state: absent
  tags: hyprland

# Everything below is user-level configuration and intentionally has no
# `become`: it must be owned by the normal user who ran bootstrap.sh,
# never root. ansible_facts.user_* reflect that invoking user, gathered
# once at the start of the play before any become escalation happens.

- name: Ensure ~/.config exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: hyprland

- name: Ensure ~/.config/hypr exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/hypr"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: hyprland

# The stop half of the session lifecycle (session.lua hyprland.shutdown);
# before the modules, which reference it.
- name: Ensure ~/.local/libexec/workstation exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.local/libexec/workstation"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: hyprland

- name: Deploy session-stop (~/.local/libexec/workstation/session-stop)
  ansible.builtin.copy:
    src: session-stop.sh
    dest: "{{ ansible_facts.user_dir }}/.local/libexec/workstation/session-stop"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: hyprland

# Modules first, entry point last: Hyprland reloads on changes to
# hyprland.lua, which then loads complete, current modules.
- name: Ensure ~/.config/hypr/conf exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/hypr/conf"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: hyprland

- name: Deploy Hyprland config modules (~/.config/hypr/conf/)
  ansible.builtin.template:
    src: "conf/{{ item }}.lua.j2"
    dest: "{{ ansible_facts.user_dir }}/.config/hypr/conf/{{ item }}.lua"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  loop: [vars, monitors, input, appearance, session, binds, rules]
  register: hyprland_modules
  # hypridle's start command (incl. per-host environment) lives in
  # session.lua - a running hypridle must be replaced for it to apply.
  notify: Restart hypridle in the running Hyprland session
  tags: hyprland

- name: Deploy the Hyprland config entry point (hyprland.lua)
  ansible.builtin.template:
    src: hyprland.lua.j2
    dest: "{{ ansible_facts.user_dir }}/.config/hypr/hyprland.lua"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  tags: hyprland

# Hyprland only watches hyprland.lua itself; a module-only change needs an
# explicit reload of the running session (no-op without one).
- name: Reload the running Hyprland after module changes
  when: hyprland_modules is changed
  ansible.builtin.shell:
    cmd: |
      sig="$(hyprctl instances -j 2>/dev/null | python3 -c 'import json, sys; d = json.load(sys.stdin); print(d[0]["instance"] if d else "")' 2>/dev/null || true)"
      if [ -z "$sig" ]; then echo no-session; exit 0; fi
      hyprctl -i "$sig" reload >/dev/null && echo reloaded
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
  changed_when: false
  tags: hyprland

# Ghostty ignores fontconfig's monospace alias (with no font-family it
# falls back to its own built-in font), so the system mono font is set
# explicitly. This takes over ~/.config/ghostty/config.ghostty, which
# until now only existed as the empty file Ghostty creates on first run.
- name: Ensure ~/.config/ghostty exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/ghostty"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: hyprland

- name: Deploy Ghostty config (system mono font)
  ansible.builtin.template:
    src: config.ghostty.j2
    dest: "{{ ansible_facts.user_dir }}/.config/ghostty/config.ghostty"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  tags: hyprland

# FEATURE: lock_idle (see group_vars/all.yml lock_idle_enabled and
# docs/feature-architecture.md).
- name: Install lock/idle packages (lock_idle_enabled)
  when: lock_idle_enabled
  become: true
  community.general.pacman:
    name: "{{ lock_idle_packages }}"
    state: present
  tags: hyprland

- name: Deploy hypridle config (lock_idle_enabled)
  when: lock_idle_enabled
  ansible.builtin.template:
    src: hypridle.conf.j2
    dest: "{{ ansible_facts.user_dir }}/.config/hypr/hypridle.conf"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  notify: Restart hypridle in the running Hyprland session
  tags: hyprland

# hyprlock reads its config on every start - no restart needed.
- name: Deploy hyprlock config (lock_idle_enabled)
  when: lock_idle_enabled
  ansible.builtin.template:
    src: hyprlock.conf.j2
    dest: "{{ ansible_facts.user_dir }}/.config/hypr/hyprlock.conf"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  tags: hyprland

# Hyprland's session start (hl.on("hyprland.start")) is hypridle's only
# lifecycle owner. A bootstrap run inside an already-running session
# would otherwise leave the feature inactive until the next login, so
# this asks THAT Hyprland instance to exec it (via its IPC -> the
# process is still Hyprland's child, same owner). No-op without a
# running Hyprland or with hypridle already up.
- name: Ensure hypridle runs in the active Hyprland session (lock_idle_enabled)
  when: lock_idle_enabled
  ansible.builtin.shell:
    cmd: "{{ lock_idle_start_script }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
  register: lock_idle_start
  changed_when: lock_idle_start.stdout == "started"
  tags: hyprland

# Disable = stop and remove only what this feature owns. Packages stay
# (Disable vs. Purge); no user data is involved.
- name: Stop hypridle (lock_idle disabled)
  when: not lock_idle_enabled
  ansible.builtin.command:
    cmd: "pkill -u {{ ansible_facts.user_uid }} -x hypridle"
  register: lock_idle_stop
  changed_when: lock_idle_stop.rc == 0
  failed_when: lock_idle_stop.rc not in [0, 1]
  tags: hyprland

- name: Remove feature-owned lock/idle configs (lock_idle disabled)
  when: not lock_idle_enabled
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/hypr/{{ item }}"
    state: absent
  loop:
    - hypridle.conf
    - hyprlock.conf
  tags: hyprland

# FEATURE: clipboard_history (see group_vars/all.yml
# clipboard_history_enabled). Hyprland's session start owns the watcher
# (session.lua); like hypridle, a bootstrap inside a running session asks
# THAT Hyprland to exec it, and replaces it when its command changed.
- name: Install clipboard history packages (clipboard_history_enabled)
  when: clipboard_history_enabled
  become: true
  community.general.pacman:
    name: "{{ clipboard_history_packages }}"
    state: present
  tags: hyprland

- name: Ensure the clipboard watcher runs in the active Hyprland session (clipboard_history_enabled)
  when: clipboard_history_enabled
  ansible.builtin.shell:
    cmd: "{{ clipboard_start_script }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
  register: clipboard_start
  changed_when: clipboard_start.stdout == "started"
  tags: hyprland

# Disable = stop the watcher. The history (~/.cache/cliphist/db) is user
# data and stays (Disable vs. Purge); `cliphist wipe` clears it.
- name: Stop the clipboard watcher (clipboard_history disabled)
  when: not clipboard_history_enabled
  ansible.builtin.command:
    cmd: "pkill -u {{ ansible_facts.user_uid }} -f '^wl-paste .*--watch cliphist'"
  register: clipboard_stop
  changed_when: clipboard_stop.rc == 0
  failed_when: clipboard_stop.rc not in [0, 1]
  tags: hyprland
