---
# Minimal-usable-daily-driver milestone: Hyprland itself, its default
# terminal, and a temporary app launcher. No bar, notifications,
# lock/idle daemon, or wallpaper tool here - see roles/desktop for the
# rest of desktop integration and docs/ARCHITECTURE.md for the intended
# final stack (Quickshell replaces the launcher and owns presentation).
hyprland_packages:
  # compositor/window manager/Wayland session owner. Pulls its own
  # dependencies (wayland, mesa, xorg-xwayland, ... already declared
  # explicitly by the graphics role) automatically via pacman.
  - hyprland

  # Default terminal. Ghostty is the deliberately chosen end-user
  # default (replaces the earlier foot placeholder from the initial
  # phase-3 session test) - GPU-accelerated, native Wayland, actively
  # developed, official Arch package. Heavier than foot, accepted as a
  # deliberate UX choice rather than the smallest-possible footprint.
  - ghostty

  # Temporary app launcher - see hyprland_launcher below. TEMPORARY
  # UNTIL QUICKSHELL REPLACEMENT: Quickshell's own launcher will take
  # over this responsibility once it exists (see docs/ARCHITECTURE.md);
  # fuzzel is a small, mature, native-Wayland launcher from the official
  # repos in the meantime, not a permanent architectural decision.
  - fuzzel

# Command the terminal keybind runs. Kept separate from the package
# name so a later terminal swap only needs to change this one value.
hyprland_terminal: ghostty

# Command the launcher keybind runs. See the TEMPORARY note above.
hyprland_launcher: fuzzel

# Main modifier for every keybind below. SUPER on real target hosts
# (laptop/workstation) - only overridden where a host has a genuine,
# real reason to differ (see host_vars/arch-dev.yml), never invented
# ahead of time. Any Hyprland-recognized modifier name works here,
# including the newer left/right-specific keysym syntax (e.g. Alt_R,
# Super_L) added in https://github.com/hyprwm/Hyprland/pull/15568 - see
# https://wiki.hypr.land/Configuring/Basics/Binds/#binding-modkeys-only
# ("Binding modkeys only"). Plain modifier names (SUPER, ALT, SHIFT,
# CTRL, ...) and keysym names both work the same way when joined with
# " + " in a bind string, so the template needs no special-casing.
hyprland_main_modifier: SUPER
