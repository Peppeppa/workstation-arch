---
# Minimal-usable-daily-driver milestone: Hyprland itself and its
# default terminal. No bar, notifications, lock/idle daemon, or
# wallpaper tool here - see roles/desktop for the rest of desktop
# integration, roles/quickshell for the shell/launcher, and
# docs/ARCHITECTURE.md for the intended final stack.
hyprland_packages:
  # compositor/window manager/Wayland session owner. Pulls its own
  # dependencies (wayland, mesa, xorg-xwayland, ... already declared
  # explicitly by the graphics role) automatically via pacman.
  - hyprland

  # Default terminal. Ghostty is the deliberately chosen end-user
  # default (replaces the earlier foot placeholder from the initial
  # phase-3 session test) - GPU-accelerated, native Wayland, actively
  # developed, official Arch package. Heavier than foot, accepted as a
  # deliberate UX choice rather than the smallest-possible footprint.
  - ghostty

  # fuzzel (the TEMPORARY-UNTIL-QUICKSHELL-REPLACEMENT launcher) is
  # gone as of Core Desktop v1: roles/quickshell's own Launcher.qml,
  # bound to mainMod+Space below, now owns this responsibility - see
  # AGENTS.md Runtime Ownership. No second launcher installed alongside
  # it.

# Command the terminal keybind runs. Kept separate from the package
# name so a later terminal swap only needs to change this one value.
hyprland_terminal: ghostty

# Command hl.on("hyprland.start", ...) uses to launch Quickshell (see
# roles/quickshell). Plain "quickshell" on real target hosts - only
# overridden where a host has a genuine, real reason to differ (see
# host_vars/arch-dev.yml and hyprland_terminal above for the identical
# pattern), never invented ahead of a real, VM/hardware-confirmed need.
hyprland_quickshell_cmd: quickshell

# Monitor scale for hl.monitor() in hyprland.lua.j2. "auto" is correct
# on real target hosts (laptop/workstation report real physical monitor
# dimensions, so Hyprland's own auto-scale heuristic works) - only
# overridden where a host has a genuine, real reason to differ (see
# host_vars/arch-dev.yml: VirtualBox's virtual display reports no
# physical size, which makes "auto" mis-detect scale 2 instead of 1).
# Set to a bare number (e.g. 1, 1.5) to override, never invented ahead
# of a real, VM/hardware-confirmed need.
hyprland_monitor_scale: auto

# Wayland session keyboard layout (hl.config({ input = { kb_layout = ...
# } }) in hyprland.lua.j2). This project's machines are primarily used
# with a German keyboard - "de" is the correct default for every current
# host (laptop, workstation, arch-dev alike), not a per-host deviation.
# Kept as a variable (not hardcoded in the template) purely for the same
# override flexibility already established for hyprland_terminal,
# should a genuine future need arise - not because a deviation exists
# today. Does not affect the pre-login virtual console
# keymap (see roles/base) or the system locale (see roles/base) - kept
# deliberately separate.
hyprland_keyboard_layout: de

# Main modifier for every keybind below. SUPER on real target hosts
# (laptop/workstation) - only overridden where a host has a genuine,
# real reason to differ (see host_vars/arch-dev.yml), never invented
# ahead of time. Use one of Hyprland's classic modifier names here
# (SUPER, ALT, SHIFT, CTRL/CONTROL, ...) - they all combine freely with
# " + " in a bind string, exactly like SUPER does throughout
# hyprland.lua.j2, so the template needs no special-casing.
#
# Do NOT use a left/right-specific keysym name (e.g. Alt_R, Super_L,
# see https://wiki.hypr.land/Configuring/Basics/Binds/#binding-modkeys-only)
# as this value: real runtime testing showed Hyprland rejects combining
# that syntax with this project's combined binds (mainMod + SHIFT +
# <key>, mainMod + <workspace number>) with "Modifiers must come first
# in the list" / "Cannot combine special syms" - it is only valid for a
# standalone bind or for combining two keysyms with each other, not for
# combining a keysym with a classic modifier the way every bind here
# does.
hyprland_main_modifier: SUPER

# FEATURE: lock_idle (see group_vars/all.yml lock_idle_enabled and
# docs/feature-architecture.md). Official Arch `extra` packages from the
# Hyprland ecosystem: hyprlock (ext-session-lock locker, PAM unlock via
# its own shipped /etc/pam.d/hyprlock) and hypridle (event-driven
# ext-idle-notify daemon, also the logind Lock/PrepareForSleep handler).
lock_idle_packages:
  - hyprlock
  - hypridle

# Idle timeouts in seconds (per-host override in host_vars if needed).
lock_idle_lock_timeout: 300   # lock
lock_idle_dpms_timeout: 600   # displays off

# Command Hyprland's session start uses for hypridle - same per-host
# override pattern as hyprland_quickshell_cmd. hyprlock is spawned by
# hypridle and inherits its environment.
lock_idle_hypridle_cmd: hypridle

# Internal: starts hypridle inside the running Hyprland instance (used by
# tasks/main.yml + handlers/main.yml). Prints "started" only if it did.
lock_idle_start_script: |
  set -eu
  if pgrep -u "$(id -u)" -x hypridle >/dev/null; then echo running; exit 0; fi
  sig="$(hyprctl instances -j 2>/dev/null | python3 -c 'import json, sys; d = json.load(sys.stdin); print(d[0]["instance"] if d else "")' 2>/dev/null || true)"
  if [ -z "$sig" ]; then echo no-session; exit 0; fi
  hyprctl -i "$sig" dispatch 'hl.dsp.exec_cmd("{{ lock_idle_hypridle_cmd }}")' >/dev/null
  echo started
