---
# hypridle reads its config and environment only at startup: after a
# change to hypridle.conf or its start command (hyprland.lua),
# replace the running instance (again exec'd by Hyprland, so the
# lifecycle owner stays Hyprland).
- name: Restart hypridle in the running Hyprland session
  when: lock_idle_enabled
  ansible.builtin.shell:
    cmd: |
      pkill -u "$(id -u)" -x hypridle || true
      timeout 5 sh -c 'while pgrep -u "$(id -u)" -x hypridle >/dev/null; do sleep 0.1; done'
      {{ lock_idle_start_script }}
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
