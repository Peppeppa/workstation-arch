---
# systemd-logind re-reads logind.conf(.d) on SIGHUP - no session restart.
- name: Reload systemd-logind configuration
  become: true
  ansible.builtin.command:
    cmd: systemctl kill --signal=SIGHUP systemd-logind.service

# Hibernate: the UKI embeds the cmdline and the initramfs - rebuild all
# presets once after either changed. Takes effect at the next boot.
- name: Rebuild the initramfs and UKI
  become: true
  ansible.builtin.command:
    cmd: mkinitcpio -P
