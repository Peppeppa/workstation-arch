# Managed by Ansible (roles/power/files/50-workstation-lid.conf) - do not
# edit by hand.
#
# Lid closed -> suspend (also on AC power); docked / external screen in
# use -> ignore. Locking is NOT done here: hypridle (feature lock_idle)
# locks the session before every suspend and holds a logind delay
# inhibitor until Hyprland reports it locked, so the machine never
# resumes unlocked. These are logind's own defaults made explicit.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
