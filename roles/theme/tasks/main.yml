---
# Core (no feature flag): every desktop color comes from here. Pure data
# handling on the controller - no files written, nothing at runtime.
# Tagged `always` (in local.yml) so a partial run (--tags quickshell)
# still has theme_colors for its templates.
#
# 1) Load and validate ALL themes, not just the selected ones, so a
#    broken/incomplete palette fails provisioning immediately instead of
#    the day someone selects it.
- name: Load all theme files
  ansible.builtin.set_fact:
    theme_catalog: >-
      {{ theme_catalog | default({}) | combine({
           (item | basename | regex_replace('\.yml$', '')): (lookup('ansible.builtin.file', item) | from_yaml)
         }) }}
  loop: "{{ query('ansible.builtin.fileglob', theme_dir ~ '/*.yml') | sort }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Require at least one theme file
  ansible.builtin.assert:
    that: theme_catalog is defined and theme_catalog | length > 0
    fail_msg: "No theme files found in {{ theme_dir }} (expected themes/<id>.yml)."
    quiet: true

- name: Validate the theme contract for every theme
  ansible.builtin.assert:
    that:
      - item.value.name is string and item.value.name | length > 0
      - item.value.mode in ['dark', 'light']
      - item.value.colors is mapping
      - (theme_roles | difference(item.value.colors.keys() | list)) | length == 0
      - (item.value.colors.keys() | list | difference(theme_roles)) | length == 0
      - item.value.colors.values() | map('regex_search', '^#[0-9a-fA-F]{6}$') | select('none') | list | length == 0
    fail_msg: >-
      themes/{{ item.key }}.yml breaks the theme contract: needs name,
      mode dark|light, and exactly the roles {{ theme_roles | join(', ') }}
      as #rrggbb (missing: {{ theme_roles | difference(item.value.colors.keys() | list) }},
      unknown: {{ item.value.colors.keys() | list | difference(theme_roles) }})
    quiet: true
  loop: "{{ theme_catalog | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# 2) Validate the selection.
- name: Validate the theme selection
  ansible.builtin.assert:
    that:
      - theme_mode in ['dark', 'light']
      - theme_dark in theme_catalog
      - theme_light in theme_catalog
      - theme_catalog[theme_dark].mode == 'dark'
      - theme_catalog[theme_light].mode == 'light'
    fail_msg: >-
      Invalid theme selection: theme_mode={{ theme_mode }},
      theme_dark={{ theme_dark }}, theme_light={{ theme_light }}.
      theme_dark/theme_light must name a dark/light theme in themes/
      (available: {{ theme_catalog.keys() | list | sort | join(', ') }}).
    quiet: true

# 3) The active palette every consumer template reads.
- name: Resolve the active theme
  ansible.builtin.set_fact:
    theme_active: "{{ theme_dark if theme_mode == 'dark' else theme_light }}"
    theme_name: "{{ theme_catalog[theme_dark if theme_mode == 'dark' else theme_light].name }}"
    theme_colors: "{{ theme_catalog[theme_dark if theme_mode == 'dark' else theme_light].colors }}"
