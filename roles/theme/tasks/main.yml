---
# Core (no feature flag): every desktop color comes from the active
# theme. All theme logic is the `theme` helper; this role deploys it,
# lets it validate every theme directory (a broken theme fails the run
# early), and applies the user's theme state - creating that state from
# group_vars theme_dark/theme_light/theme_mode ONLY if it doesn't exist
# yet, so a choice made in the bar survives every later bootstrap.
- name: Install theme helper dependencies
  become: true
  community.general.pacman:
    name: "{{ theme_packages }}"
    state: present

- name: Ensure ~/.local/bin and ~/.config/workstation exist
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/{{ item }}"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  loop:
    - .local/bin
    - .config/workstation

- name: Deploy the theme helper (~/.local/bin/theme)
  ansible.builtin.template:
    src: theme.j2
    dest: "{{ ansible_facts.user_dir }}/.local/bin/theme"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"

- name: Validate every theme directory
  ansible.builtin.command:
    cmd: "{{ ansible_facts.user_dir }}/.local/bin/theme validate"
  changed_when: false

# Renders ~/.config/workstation/theme/{colors.json,hyprland.lua,
# hyprlock.conf} from the state and applies them live where something is
# running (Quickshell IPC, hyprctl reload, GSettings). Changed only if a
# file or the GTK mode actually changed.
- name: Apply the user's theme state (initialised from group_vars if missing)
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.user_dir }}/.local/bin/theme"
      - apply
      - --init-dark
      - "{{ theme_dark }}"
      - --init-light
      - "{{ theme_light }}"
      - --init-mode
      - "{{ theme_mode }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.user_uid }}/bus"
  register: theme_apply
  changed_when: theme_apply.stdout == "changed"
