---
# Core (no feature flag): every desktop color comes from the active
# theme. All theme logic is the `theme` helper; this role deploys it,
# lets it validate every theme directory (a broken theme fails the run
# early), and applies the user's theme state - creating that state from
# group_vars theme_dark/theme_light/theme_mode ONLY if it doesn't exist
# yet, so a choice made in the bar survives every later bootstrap.
- name: Install theme helper dependencies
  become: true
  community.general.pacman:
    name: "{{ theme_packages }}"
    state: present

- name: Ensure ~/.local/bin and ~/.config/workstation exist
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/{{ item }}"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  loop:
    - .local/bin
    - .config/workstation

- name: Deploy the theme helper (~/.local/bin/theme)
  ansible.builtin.template:
    src: theme.j2
    dest: "{{ ansible_facts.user_dir }}/.local/bin/theme"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"

# Theme sources (themes/sources.yml): each pinned Omarchy theme repository
# fetched at its exact commit and compiled by the helper's SAFE importer
# (data only - nothing from a repository runs). Network only when a source
# is missing or its pin changed; afterwards themes need none.
- name: Install the pinned theme sources (themes/sources.yml)
  ansible.builtin.command:
    cmd: "{{ ansible_facts.user_dir }}/.local/bin/theme sync-sources"
  register: theme_sources
  changed_when: theme_sources.stdout == "changed"

- name: Validate every theme directory
  ansible.builtin.command:
    cmd: "{{ ansible_facts.user_dir }}/.local/bin/theme validate"
  changed_when: false

# Renders ~/.config/workstation/theme/{colors.json,hyprland.lua,
# hyprlock.conf} from the state and applies them live where something is
# running (Quickshell IPC, hyprctl reload, GSettings). Changed only if a
# file or the GTK mode actually changed.
- name: Apply the user's theme state (initialised from group_vars if missing)
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts.user_dir }}/.local/bin/theme"
      - apply
      - --init-dark
      - "{{ theme_dark }}"
      - --init-light
      - "{{ theme_light }}"
      - --init-mode
      - "{{ theme_mode }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.user_uid }}/bus"
  register: theme_apply
  changed_when: theme_apply.stdout == "changed"

# btop: its theme file follows the active workstation theme (the helper
# writes ~/.config/workstation/theme/btop.theme - the theme's own btop
# payload or one from its palette); btop reads it at start. btop.conf is
# btop's own file (it rewrites it on exit): created only if missing, with
# just the theme name - an existing one is never touched.
- name: Ensure ~/.config/btop/themes exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/btop/themes"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"

- name: btop's workstation theme follows the active theme
  ansible.builtin.file:
    src: "{{ ansible_facts.user_dir }}/.config/workstation/theme/btop.theme"
    dest: "{{ ansible_facts.user_dir }}/.config/btop/themes/workstation.theme"
    state: link
    force: true
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"

- name: Select the workstation theme in a new btop.conf (only if missing)
  ansible.builtin.copy:
    dest: "{{ ansible_facts.user_dir }}/.config/btop/btop.conf"
    content: |
      #? Created by workstation-arch (roles/theme) - btop adds its defaults.
      color_theme = "workstation"
    force: false
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
