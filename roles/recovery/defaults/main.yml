---
# Recovery (host capability recovery_enabled, group_vars/all.yml; default
# false). Design: docs/recovery-design.md. Owns the Btrfs recovery layout
# (@snapshots at /.snapshots, @swap at /swap when hibernate_enabled, the
# @recovery container for boot clones), snapper's root config, its cleanup
# timer, and the on-demand commands system-update / system-snapshot /
# system-rollback. Runtime actions never go through Ansible.
recovery_packages:
  - snapper        # snapshots of @ (official extra)
  - systemd-ukify  # builds the recovery-slot UKIs from the booted UKI (official core)
  # The bar's update icon + the updater dialog: checkupdates compares a private
  # copy of the sync databases (as the user, through fakeroot) - the system's
  # own databases are never synced outside `pacman -Syu` (no partial upgrade).
  - pacman-contrib # checkupdates (official extra)
  - fakeroot       # checkupdates' optional dependency (official core)

# Snapper retention (section 13): last 5 update pre/post pairs, last 4
# manual (important) snapshots; recovery-slot snapshots are pinned by the
# helpers and never counted. No timeline, no quota groups.
recovery_number_limit: 10
recovery_number_limit_important: 4

# systemd-boot menu timeout in seconds (loader.conf): long enough to pick a
# snapshot entry, short for a normal boot.
recovery_boot_menu_timeout: 3

# Btrfs mount options for the extra subvolumes = the root's (read from fstab).
recovery_top_mount: /run/workstation-recovery/top

# OS menu -> System -> Create Snapshot: the root helper (pkexec) under two
# names, each with its own polkit action (files/snapshot-create). The active
# local session may run snapshot-create without a password - it only CREATES
# a snapshot into an EMPTY manual slot (never deletes, modifies or rolls
# back). Overwriting or deleting a manual snapshot removes one, so it is
# snapshot-delete with the administrator password (auth_admin_keep, ~5 min
# for the calling process) - Security Hardening v1.1, S3-B.
# Remote/inactive: admin password for both.
recovery_snapshot_helper: /usr/local/libexec/workstation/snapshot-create
recovery_snapshot_polkit_action: org.workstation.snapshot.create
recovery_snapshot_delete_helper: /usr/local/libexec/workstation/snapshot-delete
recovery_snapshot_delete_polkit_action: org.workstation.snapshot.delete
# Snapshot boot: the snapshot-mode dialog's permanent restore (pkexec, admin password).
recovery_restore_helper: /usr/local/libexec/workstation/snapshot-restore
recovery_restore_polkit_action: org.workstation.snapshot.restore
