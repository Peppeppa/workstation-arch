---
# HOST CAPABILITY: recovery (group_vars recovery_enabled, default false;
# docs/recovery-design.md). Declarative layout + configuration only - every
# snapshot, slot, update and rollback is an on-demand command at runtime.
# Disable (false) changes nothing on disk (Disable vs. Purge).

- name: Recovery - root filesystem, root subvolume, boot layout (recovery_enabled)
  when: recovery_enabled
  ansible.builtin.command:
    cmd: findmnt -no FSTYPE,OPTIONS /
  register: recovery_root
  changed_when: false
  check_mode: false
  tags: recovery

- name: Recovery - the root's fstab entry (recovery_enabled)
  when: recovery_enabled
  ansible.builtin.command:
    cmd: findmnt -s -no SOURCE,OPTIONS /
  register: recovery_root_fstab
  changed_when: false
  check_mode: false
  tags: recovery

- name: Recovery - kernel cmdline file (recovery_enabled)
  when: recovery_enabled
  ansible.builtin.slurp:
    src: /etc/kernel/cmdline
  register: recovery_cmdline
  tags: recovery

- name: Recovery - stop on a layout the design does not cover (recovery_enabled)
  when: recovery_enabled
  ansible.builtin.assert:
    that:
      - recovery_root.stdout.split()[0] == 'btrfs'
      - "'subvol=/@' in recovery_root.stdout.split()[1].split(',')"
      - "'subvol=/@' in recovery_root_fstab.stdout.split()[1].split(',')"
      - "'rootflags=subvol=@' in (recovery_cmdline.content | b64decode).split()"
      - ansible_facts.mounts | selectattr('mount', 'equalto', '/boot') | map(attribute='fstype') | list == ['vfat']
    fail_msg: >-
      roles/recovery needs: a Btrfs root mounted as subvol=/@ (fstab and running),
      rootflags=subvol=@ in /etc/kernel/cmdline (systemd-boot + UKI) and the ESP
      (vfat) at /boot - see docs/recovery-design.md. Found: {{ recovery_root.stdout }}.
    quiet: true
  tags: recovery

- name: Install recovery packages (recovery_enabled)
  when: recovery_enabled
  become: true
  community.general.pacman:
    name: "{{ recovery_packages }}"
    state: present
  tags: recovery

# The top level (subvolid=5) is mounted only for this and unmounted again;
# subvolumes are created once, never recreated or deleted here.
- name: Recovery - subvolumes @snapshots, @recovery container (+ @swap with hibernate) (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.shell:
    cmd: |
      set -eu
      top={{ recovery_top_mount | quote }}
      dev=$(findmnt -no SOURCE / | sed 's/\[.*//')
      mkdir -p "$top"
      mountpoint -q "$top" || mount -o subvolid=5 "$dev" "$top"
      trap 'umount "$top"' EXIT
      for sv in @snapshots @recovery {{ '@swap' if hibernate_enabled else '' }}; do
        if [ ! -d "$top/$sv" ]; then
          btrfs subvolume create "$top/$sv" >/dev/null
          echo "created $sv"
        fi
      done
      # No_COW for the swapfile's subvolume (mkswap --file sets it on the file too)
      {% if hibernate_enabled %}chattr +C "$top/@swap"{% endif %}
  register: recovery_subvolumes
  changed_when: "'created' in recovery_subvolumes.stdout"
  tags: recovery

- name: Recovery - mount @snapshots at /.snapshots (+ @swap at /swap) (recovery_enabled)
  when: recovery_enabled and (item.when | default(true) | bool)
  become: true
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ recovery_root_fstab.stdout.split()[0] }}"
    fstype: btrfs
    opts: >-
      {{ (recovery_root_fstab.stdout.split()[1].split(',')
          | reject('match', '^subvol(id)?=') | list + ['subvol=/' ~ item.subvol]) | join(',') }}
    state: mounted
  loop:
    - { path: /.snapshots, subvol: "@snapshots" }
    - { path: /swap, subvol: "@swap", when: "{{ hibernate_enabled }}" }
  tags: recovery

- name: Recovery - snapper config "root" (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.template:
    src: snapper-root.j2
    dest: /etc/snapper/configs/root
    owner: root
    group: root
    mode: "0640"
  tags: recovery

- name: Recovery - snapper knows the root config (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.lineinfile:
    path: /etc/conf.d/snapper
    regexp: '^SNAPPER_CONFIGS='
    line: 'SNAPPER_CONFIGS="root"'
    create: true
    owner: root
    group: root
    mode: "0644"
  tags: recovery

# snapper's own cleanup (count limits; the package timer runs hourly and 10
# min after boot) - the one timer the design allows; no timeline timer.
- name: Recovery - snapper-cleanup.timer (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.systemd_service:
    name: snapper-cleanup.timer
    enabled: true
    state: started
  tags: recovery

- name: Recovery - ESP directory for recovery-slot UKIs (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.file:
    path: /boot/EFI/workstation/recovery
    state: directory
    mode: "0700"
  tags: recovery

# The normal entry stays the default; recovery entries are only picked by hand.
- name: Recovery - systemd-boot default entry (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.lineinfile:
    path: /boot/loader/loader.conf
    regexp: '^default\s'
    line: default arch-linux.efi
  tags: recovery

- name: Recovery - /usr/local/lib/workstation (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.file:
    path: /usr/local/lib/workstation
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: recovery

# The shared library is a template: it carries the path of the checkout it
# was deployed from (playbook_dir) for the snapshots' "repo <commit>" label.
- name: Recovery - shared helper library (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.template:
    src: recovery-lib.sh.j2
    dest: /usr/local/lib/workstation/recovery-lib.sh
    owner: root
    group: root
    mode: "0644"
  tags: recovery

- name: Recovery - helpers (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: system-update-root, dest: /usr/local/lib/workstation/system-update-root, mode: "0755" }
    - { src: system-update, dest: /usr/local/bin/system-update, mode: "0755" }
    - { src: system-snapshot, dest: /usr/local/bin/system-snapshot, mode: "0755" }
    - { src: system-rollback, dest: /usr/local/bin/system-rollback, mode: "0755" }
    - { src: pre-transaction-snapshot, dest: /usr/local/lib/workstation/pre-transaction-snapshot, mode: "0755" }
    - { src: recovery-baseline, dest: /usr/local/lib/workstation/recovery-baseline, mode: "0755" }
    - { src: workstation-checkupdates, dest: /usr/local/bin/workstation-checkupdates, mode: "0755" }
    - { src: snapshot-boot, dest: /usr/local/lib/workstation/snapshot-boot, mode: "0755" }
    # the marker every later snapshot of / carries (snapshot-boot offers only those)
    - { src: snapshot-boot-support, dest: /usr/local/lib/workstation/snapshot-boot-support, mode: "0644" }
  tags: recovery

# ---- Snapshot boot (docs/recovery-design.md 22) -----------------------------
# Bootable snapshots in systemd-boot: UKI copies per kernel version on the
# ESP, one entry per offered snapshot (snapshot-boot), a busybox initramfs
# hook that puts a RAM overlay over the read-only snapshot, and a snapper
# plugin that re-syncs the entries after every snapshot change. Ansible only
# deploys; the entries are runtime state of snapshot-boot.
- name: Recovery - ESP directory for snapshot-boot UKI copies (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.file:
    path: /boot/EFI/workstation/snapshots
    state: directory
    mode: "0700"
  tags: recovery

- name: Recovery - initcpio hook directories (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.file:
    path: "/etc/initcpio/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [hooks, install]
  tags: recovery

- name: Recovery - snapshot overlay initcpio hook (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.copy:
    src: "initcpio/workstation-snapshot-overlay.{{ item }}"
    dest: "/etc/initcpio/{{ 'hooks' if item == 'hook' else 'install' }}/workstation-snapshot-overlay"
    owner: root
    group: root
    mode: "0644"
  loop: [hook, install]
  notify: Back up the main UKI and rebuild the initramfs (snapshot boot)
  tags: recovery

# After the hook files: mkinitcpio fails on a HOOKS entry without its files.
- name: Recovery - snapshot overlay in the initramfs (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.copy:
    dest: /etc/mkinitcpio.conf.d/60-workstation-snapshot-overlay.conf
    content: |
      # Managed by Ansible (roles/recovery) - do not edit.
      # Snapshot boot: RAM overlay over a read-only snapshot root, only with
      # workstation.snapshot=<n> on the kernel command line (docs/recovery-design.md 22).
      HOOKS+=(workstation-snapshot-overlay)
    owner: root
    group: root
    mode: "0644"
  notify: Back up the main UKI and rebuild the initramfs (snapshot boot)
  tags: recovery

- name: Recovery - snapshot boot sync service (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.copy:
    src: workstation-snapshot-boot-sync.service
    dest: /etc/systemd/system/workstation-snapshot-boot-sync.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd (snapshot boot)
    - Sync the snapshot boot entries
  tags: recovery

# snapper runs every executable in its plugin directory on its own events.
- name: Recovery - snapper plugin directory (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.file:
    path: /usr/lib/snapper/plugins
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: recovery

- name: Recovery - snapper plugin for the snapshot boot entries (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.copy:
    src: 50-workstation-snapshot-boot.plugin
    dest: /usr/lib/snapper/plugins/50-workstation-snapshot-boot
    owner: root
    group: root
    mode: "0755"
  notify: Sync the snapshot boot entries
  tags: recovery

# OS menu -> System -> Create Snapshot (Quickshell updates/SnapshotDialog.qml):
# `pkexec snapshot-create <label>` - one manual snapshot, nothing else.
- name: Recovery - /usr/local/libexec/workstation (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.file:
    path: /usr/local/libexec/workstation
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: recovery

- name: Recovery - snapshot-create helper (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.copy:
    src: snapshot-create
    dest: "{{ recovery_snapshot_helper }}"
    owner: root
    group: root
    mode: "0755"
  tags: recovery

- name: Recovery - snapshot-restore helper (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.copy:
    src: snapshot-restore
    dest: "{{ recovery_restore_helper }}"
    owner: root
    group: root
    mode: "0755"
  tags: recovery

- name: Recovery - polkit action for snapshot-restore (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.template:
    src: snapshot-restore.policy.j2
    dest: "/usr/share/polkit-1/actions/{{ recovery_restore_polkit_action }}.policy"
    owner: root
    group: root
    mode: "0644"
  tags: recovery

- name: Recovery - polkit action for snapshot-create (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.template:
    src: snapshot.policy.j2
    dest: "/usr/share/polkit-1/actions/{{ recovery_snapshot_polkit_action }}.policy"
    owner: root
    group: root
    mode: "0644"
  tags: recovery

# pacman PreTransaction hook: one snapshot before every package transaction
# (docs/recovery-design.md 6). After the helpers it runs - a hook whose
# command is missing would abort every transaction.
- name: Recovery - pacman hook directory (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.file:
    path: /etc/pacman.d/hooks
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: recovery

- name: Recovery - pre-transaction snapshot hook (recovery_enabled)
  when: recovery_enabled
  become: true
  ansible.builtin.copy:
    src: 00-workstation-pre-snapshot.hook
    dest: /etc/pacman.d/hooks/00-workstation-pre-snapshot.hook
    owner: root
    group: root
    mode: "0644"
  tags: recovery
