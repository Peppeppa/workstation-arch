---
# The once-per-run package database sync + full system upgrade lives in
# local.yml's pre_tasks (tags: always), not here - this role only
# ensures its own packages/group membership are present. No services
# are installed or enabled by this role: the portals are D-Bus-activated
# systemd --user services shipped by their own packages, and
# hyprpolkitagent/mako are started by Hyprland's session lifecycle (see
# roles/hyprland's autostart block), not by systemd.
- name: Install desktop integration packages
  become: true
  community.general.pacman:
    name: "{{ desktop_packages }}"
    state: present
  tags: desktop

# FEATURE: screenshots (see group_vars/all.yml screenshots_enabled and
# docs/feature-architecture.md). Disabling the feature only stops this
# task from running on a future provisioning pass - it does not remove
# grim/slurp if they were already installed while the feature was on
# (see "Disable vs. Purge" in docs/feature-architecture.md).
- name: Install screenshot packages (screenshots_enabled)
  when: screenshots_enabled
  become: true
  community.general.pacman:
    name: "{{ screenshot_packages }}"
    state: present
  tags: desktop

# OCR sub-feature: requires the base screenshots feature (the helper
# script and its grim/slurp/wl-copy deps come from it), so it is gated
# on both flags - a host that disables screenshots gets no OCR either,
# no separate dependency engine needed. One pacman transaction, so the
# explicit deu/eng data packages satisfy tesseract's `tessdata`
# dependency without a provider prompt.
- name: Install screenshot OCR packages (screenshots_enabled + screenshots_ocr_enabled)
  when: screenshots_enabled and screenshots_ocr_enabled
  become: true
  community.general.pacman:
    name: "{{ screenshot_ocr_packages }}"
    state: present
  tags: desktop

# Everything below for this feature is user-level (no `become`), same
# pattern as roles/hyprland/roles/quickshell: it must be owned by the
# invoking user, never root.

# xdg-user-dir (used by screenshot.sh) only resolves PICTURES/etc. to
# their real subdirectories once ~/.config/user-dirs.dirs exists -
# without it, it falls back to bare $HOME (confirmed on a real clean
# arch-dev run: a screenshot landed in ~/Screenshots instead of
# ~/Pictures/Screenshots). xdg-user-dirs ships an autostart .desktop
# entry that normally generates this file on first graphical login,
# but this project's minimal Hyprland session runs no XDG autostart
# entries at all (see roles/hyprland's hl.on("hyprland.start", ...) -
# only hyprpolkitagent/mako/quickshell, no autostart directory
# processing), so that never happens here. Running the same tool
# Ansible already installs, once, is simpler than adding an autostart
# mechanism just for this - `creates` makes it a one-time, idempotent
# setup step that still leaves a user's own later edits to
# user-dirs.dirs untouched (it never re-runs once the file exists).
- name: Generate the user's XDG user directories once (screenshots_enabled)
  when: screenshots_enabled
  ansible.builtin.command:
    cmd: xdg-user-dirs-update
    creates: "{{ ansible_facts.user_dir }}/.config/user-dirs.dirs"
  tags: desktop

- name: Ensure ~/.local/bin exists (screenshots_enabled)
  when: screenshots_enabled
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.local/bin"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: desktop

# Plain copy, not a template: the script has no host-specific values
# to substitute (unlike hyprland.lua.j2) - the Hyprland binds that call
# it (roles/hyprland/templates/hyprland.lua.j2) pass the mode ("smart",
# "ocr") as the one argument it needs. The OCR mode ships in the same
# script either way; without screenshots_ocr_enabled it is simply never
# bound (and tesseract/its data may not be installed).
- name: Deploy the screenshot helper script (screenshots_enabled)
  when: screenshots_enabled
  ansible.builtin.copy:
    src: screenshot.sh
    dest: "{{ ansible_facts.user_dir }}/.local/bin/screenshot"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: desktop

# brightnessctl's own udev rule (shipped with the package) grants
# read/write access to backlight devices to members of the `video`
# group, so brightness control works without root or setuid. System-
# level group membership change - become is correct here even though
# it affects the invoking user, unlike the user-config tasks in
# roles/hyprland.
- name: Add the invoking user to the video group (brightnessctl access)
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    groups: video
    append: true
  tags: desktop
