---
# Desktop integration (minimal-usable-daily-driver milestone): the
# small session-level glue utilities a compositor alone doesn't provide
# - polkit authentication, XDG desktop portals, clipboard, notifications,
# and brightness control (always installed), plus the optional
# screenshots feature below (screenshot_packages, gated by
# screenshots_enabled). No bar, launcher, or lock/idle - those are
# separate concerns (roles/hyprland, roles/quickshell).
desktop_packages:
  # Polkit agent. hyprpolkitagent is Hyprland-org's own agent (not
  # polkit-gnome/mate-polkit) - avoids pulling in GNOME/MATE deps for a
  # single authentication dialog, and stays in the Hyprland ecosystem
  # already used elsewhere in this project. Must be started exactly
  # once per session (see roles/hyprland's autostart block) - it is not
  # D-Bus-activatable like the portals below.
  - hyprpolkitagent

  # XDG desktop portal stack: exactly one screen-sharing/file-chooser
  # backend combination, not a collection of competing ones.
  #   xdg-desktop-portal          - the portal frontend/dispatcher
  #   xdg-desktop-portal-hyprland - Hyprland's own backend (screen
  #                                 sharing, screenshot interfaces) -
  #                                 the Hyprland-recommended choice over
  #                                 the generic xdg-desktop-portal-wlr
  #   xdg-desktop-portal-gtk      - file chooser / settings backend
  #                                 (xdg-desktop-portal-hyprland does
  #                                 not implement FileChooser itself)
  # All three ship their own systemd --user services, D-Bus-activated -
  # no exec-once, no manual enable needed.
  - xdg-desktop-portal
  - xdg-desktop-portal-hyprland
  - xdg-desktop-portal-gtk

  # Clipboard - CLI tools only (wl-copy/wl-paste), no history/manager
  # daemon yet (not needed at this milestone). Core, not feature-gated:
  # screenshot_packages below depends on wl-copy, but so would any other
  # future clipboard consumer - this is a shared dependency, not the
  # screenshot feature itself.
  - wl-clipboard

  # Notifications: no package here anymore - Quickshell's own
  # NotificationServer is the daemon (feature notifications_enabled,
  # roles/quickshell). mako is retired, see tasks/main.yml.

  # Brightness control CLI, bound to the laptop's brightness keys in
  # roles/hyprland's hyprland.lua.j2 (also harmless/inert on the
  # workstation if it has no controllable backlight).
  - brightnessctl

  # Typography (group_vars/all.yml desktop_*_font_family), official
  # `extra` packages:
  #   adwaita-fonts     - UI font (Adwaita Sans) for GTK/sans-serif;
  #                       listed explicitly, not left as a GTK dependency
  #   ttf-firacode-nerd - shell (Quickshell/hyprlock), monospace and Nerd
  #                       Font icon glyphs (power menu, coffee toggle)
  - adwaita-fonts
  - ttf-firacode-nerd

# FEATURE: screenshots (see group_vars/all.yml screenshots_enabled -
# the actual on/off source of truth - and docs/feature-architecture.md
# for the full contract). Installed only when the feature is enabled
# (see tasks/main.yml); the two keybinds live in
# roles/hyprland/templates/hyprland.lua.j2, gated by the same flag. The
# actual capture/save/clipboard/notify workflow lives in the deployed
# screenshot.sh helper (files/screenshot.sh, see tasks/main.yml) - an
# on-demand script, never a persistent process (see AGENTS.md Runtime
# Ownership "temporary UI helper -> started on demand only").
screenshot_packages:
  - grim         # captures the actual image
  - slurp        # interactive region/window selector (screenshot smart/ocr)

  # notify-send for screenshot.sh's post-capture confirmation. Already
  # present on this system as libnotify (e.g. transitively via other
  # desktop packages) is not relied upon - listed explicitly here so
  # the dependency is deterministic and owned by this feature rather
  # than incidental.
  - libnotify

  # xdg-user-dir, used by screenshot.sh to resolve the real XDG
  # Pictures directory (respects a user-customized
  # ~/.config/user-dirs.dirs instead of a hardcoded ~/Pictures) with no
  # extra generator step needed - the tool already falls back to the
  # standard default on its own when unconfigured.
  - xdg-user-dirs

# FEATURE: screenshot OCR (see group_vars/all.yml screenshots_ocr_enabled
# - only meaningful on top of screenshots_enabled, which provides grim/
# slurp/wl-copy/the helper script itself). Purely local, on-demand OCR:
# tesseract runs once per mainMod+Shift+X press and exits - no daemon,
# no network, no persisted image.
screenshot_ocr_packages:
  - tesseract
  # Only the two languages actually needed (screenshot.sh runs
  # `-l deu+eng`, one pass for mixed German/English text). Listed
  # explicitly, not left to pacman's `tessdata` provider choice: when
  # tesseract arrives as a dependency (e.g. libmupdf, via zathura in
  # roles/apps), a --noconfirm install silently picks the alphabetically
  # first provider, tesseract-data-afr.
  - tesseract-data-deu
  - tesseract-data-eng
