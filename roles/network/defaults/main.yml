---
# Networking/VPN foundation (minimal-usable-daily-driver milestone).
# NetworkManager remains the sole networking owner (see AGENTS.md) - no
# systemd-networkd in parallel. This role does not build any network UI
# yet (that is fully specified for a later Quickshell applet in
# docs/wifi_applet.md) and does not create any VPN connection profile -
# a real profile has real endpoint/key data, which is a secret and
# cannot live in this public repository.
network_packages:
  - networkmanager   # sole networking owner; CLI stays first-class via
                     # nmcli/nmtui (already installed as part of this
                     # package), independent of any future Quickshell UI
  - wireguard-tools  # WireGuard userspace tools. The kernel WireGuard
                     # module has been in-tree since Linux 5.6, so no
                     # separate kernel package is needed. This package
                     # is the whole "VPN foundation" for now: it lets
                     # NetworkManager import/manage a WireGuard profile
                     # (`nmcli connection import type wireguard file
                     # ...`) once a real, private profile exists (from
                     # the separate private-config repository, never
                     # this one) - see AGENTS.md Networking Rules.
  - nm-connection-editor  # NetworkManager's own GTK connection editor
                     # (official extra, split from network-manager-applet):
                     # the OS menu's "Network" entry opens it on demand for
                     # everything administrative - VPN add/import/edit/
                     # delete, Ethernet/Wi-Fi profiles incl. WPA-Enterprise
                     # (eduroam), DHCP vs static IPv4, DNS. No tray applet
                     # (network-manager-applet stays out), no autostart;
                     # the bar's network popup is quick control only.
  - wireless-regdb   # the kernel's regulatory database (official core;
                     # pulls in iw). Without it cfg80211 found no
                     # regulatory.db ("Direct firmware load ... failed")
                     # and kept the restrictive world domain - measured on
                     # the laptop's Intel 7260. No country is set here: with
                     # the database present the kernel follows the country
                     # the access point announces.
  - python-dbus      # the only runtime dependency of the institution's
                     # official eduroam CAT installer (GÉANT CAT Linux
                     # script, e.g. eduroam-linux-THW.py): it creates the
                     # 802.1X profiles through NetworkManager's D-Bus API
                     # (NetworkManager mode - no wpa_supplicant/iwd config
                     # of its own). Without it the script falls back to
                     # writing a wpa_supplicant file. Enrollment workflow:
                     # README "eduroam". Nothing of the script (or any
                     # credential) is part of this repository.

# VPN protocols for nm-connection-editor (create/import), all official
# Arch plugins - NetworkManager stays the only owner; each plugin's helper
# runs only while one of its connections is up, none starts on its own:
#  - WireGuard: native in NetworkManager (+ wireguard-tools above), also
#    for a provider config such as Mullvad's (no provider app/daemon).
#  - OpenVPN: networkmanager-openvpn (+ openvpn; its openvpn-client@/
#    -server@ units stay unused - NM runs openvpn itself).
#  - OpenConnect (Cisco AnyConnect, Juniper/Pulse, GlobalProtect, ...):
#    networkmanager-openconnect (+ openconnect). Additional protocol only -
#    the THWS Fortinet VPN stays on fortisslvpn below.
#  - IPsec/IKEv2: networkmanager-strongswan (+ strongswan): NM starts
#    strongswan's charon-nm over D-Bus per connection; strongswan's own
#    daemons (strongswan.service, strongswan-starter.service) stay disabled
#    (network_vpn_disabled_units). libreswan's plugin is not in the official
#    repositories - left out.
# Left out on purpose: L2TP/vpnc/PPTP (not wanted; PPTP is broken crypto).
network_vpn_plugin_packages:
  - networkmanager-openvpn
  - openvpn
  - networkmanager-openconnect
  - openconnect
  - networkmanager-strongswan
  - strongswan
network_vpn_disabled_units:
  - strongswan.service
  - strongswan-starter.service

# FEATURE fortinet_vpn (group_vars fortinet_vpn_enabled, default false;
# laptop + workstation true): the THWS student VPN. Protocol confirmed from
# the ITSC guide (2024-11) and the gateway's login page: FortiGate SSL-VPN,
# vpn.thws.de:443, K-number + password, no client certificate, no SSO.
#
# Source decision (Package Source Policy):
#  1. official: openconnect + networkmanager-openconnect speak Fortinet,
#     but their NM plugin gets the session cookie through an interactive
#     auth dialog that only a NetworkManager secret agent starts - this
#     desktop has none on purpose (no nm-applet), so the network widget's
#     `nmcli connection up` could never connect. Not used.
#  2. upstream: FortiClient is proprietary and self-managed. Not used.
#  3. Flatpak: no VPN plugins there.
#  4. AUR (documented exception): networkmanager-fortisslvpn - the GNOME
#     NetworkManager plugin around openfortivpn. It takes user + stored
#     password as plain NM secrets, so `nmcli connection up` (the widget's
#     toggle) connects without any agent. Built from a PINNED AUR commit
#     (PKGBUILD reviewed: GNOME upstream tag 1.4.0 pinned by commit, three
#     upstream ppp-2.5 patches) with makepkg as the user + pacman -U - no
#     AUR helper. Not updated by pacman -Syu: bump the pin (commit +
#     version) here deliberately.
fortinet_vpn_packages:
  - openfortivpn       # official extra: the Fortinet SSL-VPN client the plugin runs
  - ppp                # official core: openfortivpn's tunnel (pppd)
fortinet_vpn_build_packages:
  - base-devel         # makepkg's toolchain (fakeroot, gcc, make, ...)
  - git
  - glib2-devel
  - libnma             # also the editor plugin's runtime (nm-connection-editor, GTK 3)
  - libnma-gtk4
  - pkg-config
  - python
fortinet_vpn_aur:
  name: networkmanager-fortisslvpn
  repo: https://aur.archlinux.org/networkmanager-fortisslvpn.git
  commit: ed0dffef43d2fb0c17e9fe867bc104574b662d34   # upgpkg 1.4.0-6 (2024-09-27)
  version: 1.4.0-6
