---
# End-user applications (minimal-usable-daily-driver milestone). This
# is deliberately ONE role for normal applications, not one role per
# app - see AGENTS.md Package Source Policy. apps_packages is an
# ensure-present list: adding a line installs that app on the next
# `./bootstrap.sh --tags apps`; removing a line does NOT uninstall it
# (no automatic pruning - see AGENTS.md).
#
# git is intentionally NOT listed here - it already belongs to the
# base role (roles/base/defaults/main.yml) and is not duplicated.
#
# Every package below was checked against the current official Arch
# package database before being added here (see AGENTS.md Package
# Source Policy, priority 1: official Arch repositories).
apps_packages:
  # Browser
  - chromium

  # Mail
  - thunderbird

  # File manager (GUI): Nautilus (GNOME Files, GTK4/libadwaita - follows
  # the theme's color-scheme natively, no theme hack). It extracts and
  # compresses archives itself (gnome-autoar/libarchive); its hard
  # dependencies localsearch + tinysparql (search index) and gvfs come
  # with it - localsearch is D-Bus-activated by Nautilus on demand (this
  # session runs no XDG autostart). xarchiver stays: browsing an archive
  # without extracting it is something Nautilus does not do. 7zip/zip/
  # unzip cover the CLI side, gvfs Trash/removable media/MTP.
  - nautilus
  - xarchiver
  - gvfs
  - zip
  - unzip
  - 7zip

  # File manager (TUI)
  - yazi

  # Editor: Neovim is a normal package. LazyVim is user *configuration*:
  # the starter is created once only where no ~/.config/nvim exists (see
  # tasks/main.yml - never managed afterwards). Its documented
  # requirements: ripgrep/fd (fuzzy finding), tree-sitter-cli + a C
  # compiler (gcc: nvim-treesitter builds its parsers), git, curl
  # (roles/base), fzf and lazygit (roles/shell, roles/development), a
  # Nerd Font (the system font ttf-firacode-nerd, roles/desktop).
  - neovim
  - ripgrep
  - fd
  - tree-sitter-cli
  - gcc
  # Mason installs most language servers as npm packages into its own
  # directory (no global npm install): nodejs + npm are their runtime.
  - nodejs
  - npm

  # Notes
  - obsidian

  # Password manager (desktop app only - see AGENTS.md: no vault
  # configuration, no SSH agent setup, no credentials in this repo).
  # bitwarden depends on the virtual org.freedesktop.secrets: named
  # explicitly (same transaction) so pacman does not pick the first
  # provider on its own - that was chipass, a full KeePass-style password
  # manager GUI with no D-Bus activation (so no working Secret Service at
  # all). gnome-keyring is a small Secret Service started on demand by
  # D-Bus activation - no permanent process, no extra app.
  - gnome-keyring
  - bitwarden

  # PDF: Zathura as a lean reader (mupdf backend - lighter than the
  # poppler backend) + qpdf for CLI manipulation (extract/merge/split).
  - zathura
  - zathura-pdf-mupdf
  - qpdf

  # LaTeX editor with a GUI (official `extra`), on top of the TeX Live of
  # roles/development - no second TeX distribution. Neovim + VimTeX and
  # Zathura stay the defaults (no MIME change here).
  - texstudio

  # Images: imv stays the lean default for PNG (mimeapps.list); Loupe is
  # GNOME's current image viewer (GTK4/libadwaita, follows the theme's
  # color scheme and the text size) for browsing/zooming with a GUI.
  - imv
  - loupe

  # Disks: GNOME Disks (partitions, SMART, images, mounting via udisks2).
  - gnome-disk-utility

  # Learning: Anki (spaced repetition).
  - anki

  # Tasks: Planify (GTK4 to-do app).
  - planify

  # File sync: the Nextcloud desktop client (official `extra`). Part of the
  # standard environment, so the package lives here; the private repository
  # only seeds its preferences - sign-in and the folder pairs stay by hand
  # (no account data anywhere).
  - nextcloud-client

  # Video
  - mpv

  # GitHub CLI: development tooling lives in roles/development; listed
  # there (github-cli) - not repeated here.

# Applications available only via Flatpak (Flathub) per the Package
# Source Policy (official Arch has no clean match; see AGENTS.md for
# the per-app reasoning): reverse-DNS app IDs, same ensure-present
# semantics as apps_packages above.
apps_flatpak_packages:
  # IntelliJ IDEA *Ultimate* specifically (not Community, which IS in
  # the official Arch repos as intellij-idea-community-edition, but
  # that is a different product). No clean, Ansible-reproducible
  # official JetBrains repo/package exists (JetBrains' own Toolbox App
  # is a self-updating curl-style installer, excluded by policy); the
  # Flathub package is actively maintained.
  - com.jetbrains.IntelliJ-IDEA-Ultimate
  # LocalSend (LAN file transfer to phones/other machines): not in the
  # official Arch repos; the Flathub app is LocalSend's own published
  # package (verified on Flathub 2026-10). AUR would need a helper.
  - org.localsend.localsend_app


# Web apps: a launcher entry (~/.local/share/applications/<id>.desktop)
# that opens the site in its own Chromium app window - the existing
# "web app via Chromium" approach, now visible in Applications. No
# wrapper package: there is no trustworthy native WhatsApp client for
# Linux (the AUR/Flathub "WhatsApp" apps are third-party Electron
# wrappers of the same web page). Icons from Papirus (the shell's icon
# theme).
apps_webapps:
  - id: whatsapp-web
    name: WhatsApp
    comment: WhatsApp Web in its own window
    url: https://web.whatsapp.com/
    icon: whatsapp-desktop
  # Zoom = its web client (university meetings). It shares the screen
  # through Chromium's own WebRTC + xdg-desktop-portal path - tested on
  # the laptop: faster and fully usable. The
  # native Zoom (Flathub us.zoom.Zoom 7.2.1) is retired, see
  # apps_retired_flatpak_packages.
  - id: zoom-web
    name: Zoom
    comment: Zoom web client in its own window
    url: https://app.zoom.us/wc/home
    icon: zoom-desktop
  # Discord = its web client (the user's choice 2026-10-08; Omarchy 4.0.4
  # ships Discord the same way). Screen sharing, microphone and
  # notifications through Chromium's WebRTC + xdg-desktop-portal path, like
  # Zoom. Not the Arch `discord` package: since 1:1.0.x it is only Discord's
  # updater bootstrap - the client itself is downloaded into
  # ~/.config/discord and updates itself there, outside pacman (see Package
  # Source Policy). Replaces WebCord (Flathub), see
  # apps_retired_flatpak_packages.
  - id: discord-web
    name: Discord
    comment: Discord web client in its own window
    url: https://discord.com/channels/@me
    icon: discord

# Deliberately NOT automated this run - see AGENTS.md Current Status:
#
# - GeForce NOW, Overleaf, draw.io/diagrams.net: plain web pages in
#   Chromium; an entry in apps_webapps above when one is wanted in the
#   launcher.

# Packages this role once caused to be installed and that are not wanted
# any more - removed with pacman -Rs (tasks/main.yml): their dependencies
# go too, but only those nothing else requires and that were installed as
# dependencies.
#   chipass: the accidental org.freedesktop.secrets provider for bitwarden
#            (see apps_packages; gnome-keyring replaces it)
#   thunar, thunar-archive-plugin: replaced by Nautilus. Uninstalled, not
#            just unlisted: Thunar ships its own D-Bus activation for
#            org.freedesktop.FileManager1, the same name Nautilus owns -
#            one owner per responsibility. Their XFCE libraries (exo,
#            libxfce4ui, libxfce4util, xfconf) go with them via -Rs only
#            when nothing else needs them.
# Flatpak apps this role once installed and that are not wanted any more -
# uninstalled (the app; the user's data under ~/.var/app stays).
#   us.zoom.Zoom - the native Zoom (XWayland): its share toolbars are
#            override-redirect X11 windows that get no pointer input unless
#            the pointer came in through a managed Zoom window (measured
#            2026-10-06: X keeps the old pointer position; "Stop share",
#            mute etc. never receive the click - Zoom looked frozen). Its
#            Wayland setting (xwayland=false) is ignored by the Flatpak
#            build. Replaced by the web client (apps_webapps "Zoom").
#   io.github.spacingbat3.webcord - WebCord (third-party Electron wrapper
#            of Discord's web page), replaced by the Discord web app
#            (apps_webapps "Discord") - one Discord client.
apps_retired_flatpak_packages:
  - us.zoom.Zoom
  - io.github.spacingbat3.webcord

apps_retired_packages:
  - chipass
  - thunar-archive-plugin
  - thunar

# Chromium managed policy (/etc/chromium/policies/managed/workstation.json,
# Chromium's own supported mechanism - no profile files touched).
#
# Extensions: installed by Chromium itself from the Chrome Web Store and
# kept updated there (nothing is downloaded or vendored here).
# "normal_installed" = installed automatically, cannot be removed, can be
# disabled in chrome://extensions. IDs verified 2026-10-07 against the
# store page (title + publisher) and the user's existing Chromium install:
chromium_extensions:
  - id: gighmmpiobklfepjocnamgkkbiglidom   # AdBlock - Adblock, Inc. (getadblock.com)
  - id: nngceckbapebfimnlniiiahkandclblb   # Bitwarden Password Manager - Bitwarden Inc.
  - id: lfjnnkckddkopjfgmbcpdiolnmfobflj   # Custom New Tab - Dictanote (dictanote.co)
  - id: eimadpbcbfnmbkopoojfekhnkhdbieeh   # Dark Reader - Alexander Shutau (darkreader.org)
  - id: dbepggeogbaibhgnhhndojpepiihcmeb   # Vimium - Phil Crosby (github.com/philc/vimium)
  - id: ddkjiahejlhfcafbddmgiahcphecmpfh   # uBlock Origin Lite - Raymond Hill
chromium_extension_update_url: https://clients2.google.com/service/update2/crx

# THWS library proxy ("Externer Zugang", bibliothek.thws.de): the library's
# own PAC - THWS owns the domain list (~170 publisher domains -> its proxy,
# everything else DIRECT); Chromium fetches it itself, nothing runs here.
# Independent of the THWS VPN. ProxyPacMandatory stays off: an unreachable
# PAC falls back to direct connections instead of breaking browsing. The
# proxy's credentials are the user's: entered in Chromium's own proxy
# login dialog, saved (if at all) by Chromium's password manager, whose
# key lives in the Secret Service (gnome-keyring) - never here.
chromium_proxy_pac_url: https://www.bibliothek.thws.de/proxy.pac

# Neovim languages (README "Shell and Neovim" -> "Languages"): LazyVim
# extras that are switched on in ~/.config/nvim/lazyvim.json - ADDED to the
# list there (extras chosen with :LazyExtras stay; nothing is removed).
apps_nvim_extras:
  - lazyvim.plugins.extras.dap.core            # debugging (nvim-dap + UI): Java, Python, C, Rust
  - lazyvim.plugins.extras.formatting.prettier # HTML/CSS/JS/JSON/YAML/Markdown formatting
  - lazyvim.plugins.extras.lang.ansible        # ansiblels + ansible-lint, yaml.ansible filetype
  - lazyvim.plugins.extras.lang.clangd         # C: clangd (+ clang-format inside), codelldb
  - lazyvim.plugins.extras.lang.docker         # dockerls, compose LS, hadolint
  - lazyvim.plugins.extras.lang.java           # nvim-jdtls: jdtls, java-debug-adapter, java-test
  - lazyvim.plugins.extras.lang.json           # jsonls + SchemaStore
  - lazyvim.plugins.extras.lang.markdown       # marksman, markdownlint-cli2, preview
  - lazyvim.plugins.extras.lang.python         # pyright + ruff, debugpy, venv selector
  - lazyvim.plugins.extras.lang.rust           # rustaceanvim (rust-analyzer: pacman), codelldb
  - lazyvim.plugins.extras.lang.toml           # taplo
  - lazyvim.plugins.extras.lang.typescript     # JavaScript/TypeScript: vtsls
  - lazyvim.plugins.extras.lang.yaml           # yamlls + SchemaStore

# Installed by the bootstrap (headless, nvim-install.lua) so every language
# works at the first start - the same packages LazyVim's extras and
# workstation-languages.lua would fetch on their own. Already installed =
# untouched (updates stay :Mason's / :MasonUpdate).
apps_nvim_mason_packages:
  - jdtls
  - java-debug-adapter
  - java-test
  - pyright
  - ruff
  - debugpy
  - marksman
  - markdownlint-cli2
  - markdown-toc
  - ansible-language-server
  - ansible-lint
  - yaml-language-server
  - clangd
  - codelldb
  - json-lsp
  - taplo
  - dockerfile-language-server
  - docker-compose-language-service
  - hadolint
  - vtsls
  - js-debug-adapter
  - prettier
  - html-lsp
  - css-lsp
  - bash-language-server
  - shellcheck
  - shfmt
  - lua-language-server
  - stylua
  - asm-lsp
