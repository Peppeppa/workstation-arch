---
# End-user applications (minimal-usable-daily-driver milestone). This
# is deliberately ONE role for normal applications, not one role per
# app - see AGENTS.md Package Source Policy. apps_packages is an
# ensure-present list: adding a line installs that app on the next
# `./bootstrap.sh --tags apps`; removing a line does NOT uninstall it
# (no automatic pruning - see AGENTS.md).
#
# git is intentionally NOT listed here - it already belongs to the
# base role (roles/base/defaults/main.yml) and is not duplicated.
#
# Every package below was checked against the current official Arch
# package database before being added here (see AGENTS.md Package
# Source Policy, priority 1: official Arch repositories).
apps_packages:
  # Browser
  - chromium

  # Mail
  - thunderbird

  # File manager (GUI): Nautilus (GNOME Files, GTK4/libadwaita - follows
  # the theme's color-scheme natively, no theme hack). It extracts and
  # compresses archives itself (gnome-autoar/libarchive); its hard
  # dependencies localsearch + tinysparql (search index) and gvfs come
  # with it - localsearch is D-Bus-activated by Nautilus on demand (this
  # session runs no XDG autostart). xarchiver stays: browsing an archive
  # without extracting it is something Nautilus does not do. 7zip/zip/
  # unzip cover the CLI side, gvfs Trash/removable media/MTP.
  - nautilus
  - xarchiver
  - gvfs
  - zip
  - unzip
  - 7zip

  # File manager (TUI)
  - yazi

  # Editor: Neovim is a normal package. LazyVim is user *configuration*:
  # the starter is created once only where no ~/.config/nvim exists (see
  # tasks/main.yml - never managed afterwards). Its documented
  # requirements: ripgrep/fd (fuzzy finding), tree-sitter-cli + a C
  # compiler (gcc: nvim-treesitter builds its parsers), git, curl
  # (roles/base), fzf and lazygit (roles/shell, roles/development), a
  # Nerd Font (the system font ttf-firacode-nerd, roles/desktop).
  - neovim
  - ripgrep
  - fd
  - tree-sitter-cli
  - gcc

  # Notes
  - obsidian

  # Password manager (desktop app only - see AGENTS.md: no vault
  # configuration, no SSH agent setup, no credentials in this repo).
  # bitwarden depends on the virtual org.freedesktop.secrets: named
  # explicitly (same transaction) so pacman does not pick the first
  # provider on its own - that was chipass, a full KeePass-style password
  # manager GUI with no D-Bus activation (so no working Secret Service at
  # all). gnome-keyring is a small Secret Service started on demand by
  # D-Bus activation - no permanent process, no extra app.
  - gnome-keyring
  - bitwarden

  # PDF: Zathura as a lean reader (mupdf backend - lighter than the
  # poppler backend) + qpdf for CLI manipulation (extract/merge/split).
  - zathura
  - zathura-pdf-mupdf
  - qpdf

  # Images: imv stays the lean default for PNG (mimeapps.list); Loupe is
  # GNOME's current image viewer (GTK4/libadwaita, follows the theme's
  # color scheme and the text size) for browsing/zooming with a GUI.
  - imv
  - loupe

  # Disks: GNOME Disks (partitions, SMART, images, mounting via udisks2).
  - gnome-disk-utility

  # Learning: Anki (spaced repetition).
  - anki

  # Tasks: Planify (GTK4 to-do app).
  - planify

  # Video
  - mpv

  # GitHub CLI: development tooling lives in roles/development; listed
  # there (github-cli) - not repeated here.

# Applications available only via Flatpak (Flathub) per the Package
# Source Policy (official Arch has no clean match; see AGENTS.md for
# the per-app reasoning): reverse-DNS app IDs, same ensure-present
# semantics as apps_packages above.
apps_flatpak_packages:
  # IntelliJ IDEA *Ultimate* specifically (not Community, which IS in
  # the official Arch repos as intellij-idea-community-edition, but
  # that is a different product). No clean, Ansible-reproducible
  # official JetBrains repo/package exists (JetBrains' own Toolbox App
  # is a self-updating curl-style installer, excluded by policy); the
  # Flathub package is actively maintained.
  - com.jetbrains.IntelliJ-IDEA-Ultimate
  # LocalSend (LAN file transfer to phones/other machines): not in the
  # official Arch repos; the Flathub app is LocalSend's own published
  # package (verified on Flathub 2026-10). AUR would need a helper.
  - org.localsend.localsend_app
  # WebCord (Discord client): not in the official Arch repos. Its Flathub
  # package was EOL earlier; it is maintained again (updates through
  # 2026-07, no end-of-life marker - checked with `flatpak remote-info`
  # 2026-10). This is the source change for WebCord: from "Chromium web
  # app" (never installed) to Flathub.
  - io.github.spacingbat3.webcord

  # Zoom (university video calls): not in the official Arch repos. Zoom's
  # own Linux download (zoom_x86_64.pkg.tar.xz) is a single file, not a
  # repository - no clean, Ansible-reproducible update path (the same
  # reason as JetBrains above); the AUR `zoom` only repackages it. The
  # Flathub app is maintained (update 2026-10-02, `flatpak remote-info`
  # checked 2026-10) and fetches Zoom's official binary as extra-data.
  # Screen sharing goes through xdg-desktop-portal like every other app
  # (docs/feature-architecture.md "Screen sharing").
  - us.zoom.Zoom

# Web apps: a launcher entry (~/.local/share/applications/<id>.desktop)
# that opens the site in its own Chromium app window - the existing
# "web app via Chromium" approach, now visible in Applications. No
# wrapper package: there is no trustworthy native WhatsApp client for
# Linux (the AUR/Flathub "WhatsApp" apps are third-party Electron
# wrappers of the same web page). Icons from Papirus (the shell's icon
# theme).
apps_webapps:
  - id: whatsapp-web
    name: WhatsApp
    comment: WhatsApp Web in its own window
    url: https://web.whatsapp.com/
    icon: whatsapp-desktop

# Deliberately NOT automated this run - see AGENTS.md Current Status:
#
# - GeForce NOW, Overleaf, draw.io/diagrams.net: plain web pages in
#   Chromium; an entry in apps_webapps above when one is wanted in the
#   launcher.

# Packages this role once caused to be installed and that are not wanted
# any more - removed with pacman -Rs (tasks/main.yml): their dependencies
# go too, but only those nothing else requires and that were installed as
# dependencies.
#   chipass: the accidental org.freedesktop.secrets provider for bitwarden
#            (see apps_packages; gnome-keyring replaces it)
#   thunar, thunar-archive-plugin: replaced by Nautilus. Uninstalled, not
#            just unlisted: Thunar ships its own D-Bus activation for
#            org.freedesktop.FileManager1, the same name Nautilus owns -
#            one owner per responsibility. Their XFCE libraries (exo,
#            libxfce4ui, libxfce4util, xfconf) go with them via -Rs only
#            when nothing else needs them.
apps_retired_packages:
  - chipass
  - thunar-archive-plugin
  - thunar
