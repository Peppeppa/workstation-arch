---
# The once-per-run package database sync + full system upgrade lives in
# local.yml's pre_tasks (tags: always), not here - this role only
# ensures its own packages are present, ensure-present (see
# defaults/main.yml) - removing a line from the list never uninstalls
# anything automatically.
- name: Install end-user applications
  become: true
  community.general.pacman:
    name: "{{ apps_packages }}"
    state: present
  tags: apps

# Explicit removals (defaults/main.yml apps_retired_packages) - after the
# install above, which already provides their replacements.
# Chromium's managed policy (extensions + the THWS library PAC) - see
# defaults. JSON comments are not allowed there, so the file says nothing
# about its origin: managed by roles/apps.
- name: Ensure Chromium's managed policy directory exists
  become: true
  ansible.builtin.file:
    path: /etc/chromium/policies/managed
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: apps

- name: Deploy the Chromium managed policy (extensions, library proxy PAC)
  become: true
  ansible.builtin.template:
    src: chromium-policy.json.j2
    dest: /etc/chromium/policies/managed/workstation.json
    owner: root
    group: root
    mode: "0644"
    validate: python3 -m json.tool %s
  tags: apps

- name: Remove retired application packages
  become: true
  community.general.pacman:
    name: "{{ apps_retired_packages }}"
    state: absent
    # pacman -Rs: also their dependencies that nothing else needs (and that
    # were only installed as dependencies) - never anything still required.
    extra_args: --recursive
  tags: apps

# Flatpak is only installed/configured because at least one desired app
# (IntelliJ IDEA Ultimate) has no clean official-Arch or upstream path -
# see defaults/main.yml and AGENTS.md Package Source Policy. Flathub is
# configured exactly once, declaratively; app installs are ensure-
# present, same as the pacman list above.
- name: Install Flatpak
  become: true
  community.general.pacman:
    name: flatpak
    state: present
  tags: apps

- name: Add the Flathub remote
  become: true
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    method: system
    state: present
  tags: apps

- name: Install Flatpak applications
  become: true
  community.general.flatpak:
    name: "{{ apps_flatpak_packages }}"
    remote: flathub
    method: system
    state: present
  tags: apps

# Web apps (defaults/main.yml apps_webapps): one launcher entry each,
# user level. Ensure-present like the package lists - an entry removed
# from the list is not deleted.
- name: Ensure ~/.local/share/applications exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.local/share/applications"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: apps

- name: Remove retired Flatpak applications
  become: true
  community.general.flatpak:
    name: "{{ apps_retired_flatpak_packages }}"
    method: system
    state: absent
  tags: apps

- name: Web app launcher entries
  ansible.builtin.template:
    src: webapp.desktop.j2
    dest: "{{ ansible_facts.user_dir }}/.local/share/applications/{{ item.id }}.desktop"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  loop: "{{ apps_webapps }}"
  loop_control:
    label: "{{ item.id }}"
  tags: apps

# User-level MIME default overrides - no become, owned by the invoking
# user (same pattern as roles/hyprland). Ensure ~/.config exists here
# too rather than assuming roles/hyprland already ran: --tags apps must
# work standalone.
- name: Ensure ~/.config exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: apps

# Real-VM finding on arch-dev: with no default set, application/pdf and
# image/png both resolved to chromium.desktop instead of the readers
# this role actually installs zathura/imv for - see
# templates/mimeapps.list.j2.
- name: Set default applications (folders, PDF, PNG)
  ansible.builtin.template:
    src: mimeapps.list.j2
    dest: "{{ ansible_facts.user_dir }}/.config/mimeapps.list"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  tags: apps

# LazyVim: Neovim configuration is the user's (dotfiles). Only when there is
# NO ~/.config/nvim at all, the LazyVim starter is created once (files/nvim:
# init.lua, lua/config/lazy.lua and the workstation theme interface
# lua/plugins/workstation-theme.lua) - like the bar layout, provisioning
# initialises missing user state but never manages it: an existing
# directory (yours, stowed, or this starter later edited) is never touched.
# LazyVim installs its plugins itself at the first `nvim` start.
- name: Check for a Neovim configuration
  ansible.builtin.stat:
    path: "{{ ansible_facts.user_dir }}/.config/nvim"
  register: apps_nvim_config
  tags: apps

- name: Create the LazyVim starter (only without any Neovim configuration)
  when: not apps_nvim_config.stat.exists
  ansible.builtin.copy:
    src: nvim/
    dest: "{{ ansible_facts.user_dir }}/.config/nvim/"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
    directory_mode: "0755"
  tags: apps

# The one Neovim file workstation-arch keeps managed: the user's keymaps
# (LazyVim's lua/config/keymaps.lua, loaded after LazyVim's defaults).
# Everything else under ~/.config/nvim stays the user's.
- name: Ensure ~/.config/nvim/lua/config exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/nvim/lua/config"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: apps

- name: Deploy the Neovim keymaps (lua/config/keymaps.lua)
  ansible.builtin.copy:
    src: nvim-keymaps.lua
    dest: "{{ ansible_facts.user_dir }}/.config/nvim/lua/config/keymaps.lua"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  tags: apps
