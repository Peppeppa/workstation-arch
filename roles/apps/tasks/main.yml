---
# The once-per-run package database sync + full system upgrade lives in
# local.yml's pre_tasks (tags: always), not here - this role only
# ensures its own packages are present, ensure-present (see
# defaults/main.yml) - removing a line from the list never uninstalls
# anything automatically.
- name: Install end-user applications
  become: true
  community.general.pacman:
    name: "{{ apps_packages }}"
    state: present
  tags: apps

# Explicit removals (defaults/main.yml apps_retired_packages) - after the
# install above, which already provides their replacements.
# Chromium's managed policy (extensions + the THWS library PAC) - see
# defaults. JSON comments are not allowed there, so the file says nothing
# about its origin: managed by roles/apps.
- name: Ensure Chromium's managed policy directory exists
  become: true
  ansible.builtin.file:
    path: /etc/chromium/policies/managed
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: apps

- name: Deploy the Chromium managed policy (extensions, library proxy PAC)
  become: true
  ansible.builtin.template:
    src: chromium-policy.json.j2
    dest: /etc/chromium/policies/managed/workstation.json
    owner: root
    group: root
    mode: "0644"
    validate: python3 -m json.tool %s
  tags: apps

- name: Remove retired application packages
  become: true
  community.general.pacman:
    name: "{{ apps_retired_packages }}"
    state: absent
    # pacman -Rs: also their dependencies that nothing else needs (and that
    # were only installed as dependencies) - never anything still required.
    extra_args: --recursive
  tags: apps

# Flatpak is only installed/configured because at least one desired app
# (IntelliJ IDEA Ultimate) has no clean official-Arch or upstream path -
# see defaults/main.yml and AGENTS.md Package Source Policy. Flathub is
# configured exactly once, declaratively; app installs are ensure-
# present, same as the pacman list above.
- name: Install Flatpak
  become: true
  community.general.pacman:
    name: flatpak
    state: present
  tags: apps

- name: Add the Flathub remote
  become: true
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    method: system
    state: present
  tags: apps

- name: Install Flatpak applications
  become: true
  community.general.flatpak:
    name: "{{ apps_flatpak_packages }}"
    remote: flathub
    method: system
    state: present
  tags: apps

# Web apps (defaults/main.yml apps_webapps): one launcher entry each,
# user level. Ensure-present like the package lists - an entry removed
# from the list is not deleted.
- name: Ensure ~/.local/share/applications exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.local/share/applications"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: apps

- name: Remove retired Flatpak applications
  become: true
  community.general.flatpak:
    name: "{{ apps_retired_flatpak_packages }}"
    method: system
    state: absent
  tags: apps

- name: Web app launcher entries
  ansible.builtin.template:
    src: webapp.desktop.j2
    dest: "{{ ansible_facts.user_dir }}/.local/share/applications/{{ item.id }}.desktop"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  loop: "{{ apps_webapps }}"
  loop_control:
    label: "{{ item.id }}"
  tags: apps

# User-level MIME default overrides - no become, owned by the invoking
# user (same pattern as roles/hyprland). Ensure ~/.config exists here
# too rather than assuming roles/hyprland already ran: --tags apps must
# work standalone.
- name: Ensure ~/.config exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: apps

# Real-VM finding on arch-dev: with no default set, application/pdf and
# image/png both resolved to chromium.desktop instead of the readers
# this role actually installs zathura/imv for - see
# templates/mimeapps.list.j2.
- name: Set default applications (folders, PDF, PNG)
  ansible.builtin.template:
    src: mimeapps.list.j2
    dest: "{{ ansible_facts.user_dir }}/.config/mimeapps.list"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  tags: apps

# LazyVim: Neovim configuration is the user's (dotfiles). Only when there is
# NO ~/.config/nvim at all, the LazyVim starter is created once (files/nvim:
# init.lua, lua/config/lazy.lua and the workstation theme interface
# lua/plugins/workstation-theme.lua) - like the bar layout, provisioning
# initialises missing user state but never manages it: an existing
# directory (yours, stowed, or this starter later edited) is never touched.
# LazyVim installs its plugins itself at the first `nvim` start.
- name: Check for a Neovim configuration
  ansible.builtin.stat:
    path: "{{ ansible_facts.user_dir }}/.config/nvim"
  register: apps_nvim_config
  tags: apps

- name: Create the LazyVim starter (only without any Neovim configuration)
  when: not apps_nvim_config.stat.exists
  ansible.builtin.copy:
    src: nvim/
    dest: "{{ ansible_facts.user_dir }}/.config/nvim/"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
    directory_mode: "0755"
  tags: apps

# The two Neovim files workstation-arch keeps managed: the user's keymaps
# (LazyVim's lua/config/keymaps.lua, loaded after LazyVim's defaults) and
# the VimTeX plugin spec (lua/plugins/vimtex.lua; lazy.nvim installs the
# plugin at the next `nvim` start). Everything else under ~/.config/nvim
# stays the user's.
- name: Ensure ~/.config/nvim/lua/config and lua/plugins exist
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/nvim/lua/{{ item }}"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  loop: [config, plugins]
  tags: apps

- name: Deploy the Neovim keymaps (lua/config/keymaps.lua)
  ansible.builtin.copy:
    src: nvim-keymaps.lua
    dest: "{{ ansible_facts.user_dir }}/.config/nvim/lua/config/keymaps.lua"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  tags: apps

# The Neovim document of Quickshell's cheatsheet (mainMod + T, Tab):
# Vim, LazyVim, these keymaps and VimTeX - next to the keymaps it lists.
- name: Ensure the cheatsheet documents directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.local/share/workstation/cheatsheets"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: apps

- name: Deploy the Neovim keybinding document (cheatsheets/neovim.md)
  ansible.builtin.copy:
    src: cheatsheet-neovim.md
    dest: "{{ ansible_facts.user_dir }}/.local/share/workstation/cheatsheets/neovim.md"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  tags: apps

- name: Deploy the VimTeX plugin spec (lua/plugins/vimtex.lua)
  ansible.builtin.copy:
    src: nvim-vimtex.lua
    dest: "{{ ansible_facts.user_dir }}/.config/nvim/lua/plugins/vimtex.lua"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  tags: apps

# Languages (README "Shell and Neovim" -> "Languages"): the third managed
# Neovim file (what no LazyVim extra provides) ...
- name: Deploy the Neovim language spec (lua/plugins/workstation-languages.lua)
  ansible.builtin.copy:
    src: nvim-languages.lua
    dest: "{{ ansible_facts.user_dir }}/.config/nvim/lua/plugins/workstation-languages.lua"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  tags: apps

# ... and the LazyVim extras, ADDED to lazyvim.json's list (LazyVim's own
# place for extras - loaded in the right order before lua/plugins/). Other
# extras and keys in the file stay; created minimal when LazyVim has not
# written it yet. Prints "changed" only when an extra was added.
- name: Enable the LazyVim language extras (lazyvim.json)
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json, os, sys
        path, wanted = sys.argv[1], sys.argv[2:]
        try:
            with open(path) as f:
                data = json.load(f)
        except FileNotFoundError:
            data = {}
        extras = data.setdefault("extras", [])
        added = [e for e in wanted if e not in extras]
        if added:
            extras.extend(added)
            tmp = path + ".tmp"
            with open(tmp, "w") as f:
                json.dump(data, f, indent=2)
                f.write("\n")
            os.replace(tmp, path)
        print("changed" if added else "unchanged")
      - "{{ ansible_facts.user_dir }}/.config/nvim/lazyvim.json"
      - "{{ apps_nvim_extras }}"
  register: apps_nvim_extras_result
  changed_when: apps_nvim_extras_result.stdout == "changed"
  tags: apps

- name: Ensure ~/.local/share/workstation exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.local/share/workstation"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: apps

- name: Deploy the Neovim headless installer (nvim-install.lua)
  ansible.builtin.copy:
    src: nvim-install.lua
    dest: "{{ ansible_facts.user_dir }}/.local/share/workstation/nvim-install.lua"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  tags: apps

# Plugins, Mason packages and Tree-sitter parsers are installed now (as the
# user, headless), not at the first interactive start: missing ones only,
# nothing updated (nvim-install.lua). Fails when one could not be installed.
- name: Install missing Neovim plugins, Mason packages and parsers (headless)
  ansible.builtin.command:
    cmd: timeout 1800 nvim --headless "+luafile {{ ansible_facts.user_dir }}/.local/share/workstation/nvim-install.lua"
  environment:
    WS_MASON: "{{ apps_nvim_mason_packages | join(' ') }}"
  register: apps_nvim_tools
  changed_when: "'WS_CHANGED yes' in apps_nvim_tools.stdout"
  tags: apps
