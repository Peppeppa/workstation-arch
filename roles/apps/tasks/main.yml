---
# The once-per-run package database sync + full system upgrade lives in
# local.yml's pre_tasks (tags: always), not here - this role only
# ensures its own packages are present, ensure-present (see
# defaults/main.yml) - removing a line from the list never uninstalls
# anything automatically.
- name: Install end-user applications
  become: true
  community.general.pacman:
    name: "{{ apps_packages }}"
    state: present
  tags: apps

# Flatpak is only installed/configured because at least one desired app
# (IntelliJ IDEA Ultimate) has no clean official-Arch or upstream path -
# see defaults/main.yml and AGENTS.md Package Source Policy. Flathub is
# configured exactly once, declaratively; app installs are ensure-
# present, same as the pacman list above.
- name: Install Flatpak
  become: true
  community.general.pacman:
    name: flatpak
    state: present
  tags: apps

- name: Add the Flathub remote
  become: true
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    method: system
    state: present
  tags: apps

- name: Install Flatpak applications
  become: true
  community.general.flatpak:
    name: "{{ apps_flatpak_packages }}"
    remote: flathub
    method: system
    state: present
  tags: apps

# User-level MIME default overrides - no become, owned by the invoking
# user (same pattern as roles/hyprland). Ensure ~/.config exists here
# too rather than assuming roles/hyprland already ran: --tags apps must
# work standalone.
- name: Ensure ~/.config exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: apps

# Real-VM finding on arch-dev: with no default set, application/pdf and
# image/png both resolved to chromium.desktop instead of the readers
# this role actually installs zathura/imv for - see
# templates/mimeapps.list.j2.
- name: Set default applications for PDF and PNG (zathura, imv)
  ansible.builtin.template:
    src: mimeapps.list.j2
    dest: "{{ ansible_facts.user_dir }}/.config/mimeapps.list"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  tags: apps
