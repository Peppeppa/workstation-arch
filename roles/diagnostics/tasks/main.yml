---
# The shared functions first: all three tools import them at start.
- name: Create the shared library directory (/usr/local/lib/workstation)
  become: true
  ansible.builtin.file:
    path: "{{ diagnostics_lib_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: diagnostics

- name: Deploy diaglib.py (shared by repo-healthcheck, repo-diagnose, repo-logs)
  become: true
  ansible.builtin.copy:
    src: diaglib.py
    dest: "{{ diagnostics_lib_dir }}/diaglib.py"
    owner: root
    group: root
    mode: "0644"
  tags: diagnostics

- name: Deploy repo-diagnose (/usr/local/bin/repo-diagnose)
  become: true
  ansible.builtin.template:
    src: repo-diagnose.j2
    dest: "{{ diagnostics_bin }}"
    owner: root
    group: root
    mode: "0755"
  tags: diagnostics

# repo-healthcheck: the PASS/FAIL view of the same system (invariants,
# exit code) - repo-diagnose stays the place for details.
- name: Deploy repo-healthcheck (/usr/local/bin/repo-healthcheck)
  become: true
  ansible.builtin.template:
    src: repo-healthcheck.j2
    dest: "{{ diagnostics_healthcheck_bin }}"
    owner: root
    group: root
    mode: "0755"
  tags: diagnostics

# repo-logs: OS menu -> System -> Diagnostic (logs, log analysis, the
# healthcheck/diagnose views in the terminal).
- name: Deploy repo-logs (/usr/local/bin/repo-logs)
  become: true
  ansible.builtin.template:
    src: repo-logs.j2
    dest: "{{ diagnostics_logs_bin }}"
    owner: root
    group: root
    mode: "0755"
  tags: diagnostics

# A first deployment put it into ~/.local/bin, which is on nobody's PATH.
- name: Remove the retired per-user copy (~/.local/bin/repo-diagnose)
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.local/bin/repo-diagnose"
    state: absent
  tags: diagnostics
