---
# Phase 1 equivalent: minimal base packages.
#
# The once-per-run package database sync + full system upgrade lives in
# local.yml's pre_tasks (tags: always), not here - this role only
# ensures its own packages are present, so a full upgrade never runs
# more than once per provisioning run no matter which --tags are
# selected.
- name: Install base packages
  become: true
  community.general.pacman:
    name: "{{ base_packages }}"
    state: present
  tags: base

# Inbound SSH is key-only on every host (drop-in, the upstream
# sshd_config stays the package's): no passwords, no keyboard-interactive
# PAM prompts. Deployed whether or not the server runs, so a server
# enabled later is never password-reachable. sshd reads the FIRST value it
# finds, so the drop-in sorts before the package's 99-archlinux.conf.
# The SSH client (openssh) is independent of all of this.
- name: Deploy the key-only sshd drop-in
  become: true
  ansible.builtin.copy:
    src: 10-workstation-key-only.conf
    dest: /etc/ssh/sshd_config.d/10-workstation-key-only.conf
    owner: root
    group: root
    mode: "0644"
    # -G parses without needing host keys (a host whose server never ran has none)
    validate: /usr/bin/sshd -G -f %s
  notify: Reload sshd
  tags: base

# HOST CAPABILITY: ssh_server_enabled (group_vars, default false). sshd is
# a machine-wide daemon -> systemd system service, enabled only on a host
# that is administered remotely (the test laptop, arch-dev); roles/firewall
# opens tcp/22 only there. false stops and disables the server (running
# sessions survive: sshd-session processes are not part of the unit's
# stop) - the package stays.
- name: Enable and start sshd (ssh_server_enabled)
  when: ssh_server_enabled
  become: true
  ansible.builtin.systemd_service:
    name: sshd.service
    enabled: true
    state: started
  tags: base

- name: Disable and stop sshd (ssh_server_enabled false)
  when: not ssh_server_enabled
  become: true
  ansible.builtin.systemd_service:
    name: sshd.service
    enabled: false
    state: stopped
  tags: base

# SSH CLIENT: keys come from the Bitwarden SSH agent (Bitwarden desktop's
# own socket, ~/.bitwarden-ssh-agent.sock). Only this one managed block in
# ~/.ssh/config - anything else in the file stays the user's; it sits at the
# END, so a more specific Host entry above it wins (OpenSSH takes the first
# value it finds). No key, no secret, no socket is created here: without a
# running/unlocked Bitwarden ssh simply finds no agent and goes on.
- name: Ensure ~/.ssh exists (0700)
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.ssh"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0700"
  tags: base

- name: SSH client uses the Bitwarden SSH agent (~/.ssh/config, managed block)
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts.user_dir }}/.ssh/config"
    marker: "# {mark} workstation-arch (roles/base): Bitwarden SSH agent"
    block: |
      Host *
          IdentityAgent ~/.bitwarden-ssh-agent.sock
    create: true
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0600"
  tags: base

# Locale generation is a system-wide (not Hyprland-specific) concern, so
# it lives here rather than in roles/hyprland. Conservative choice, not a
# full locale framework: generate en_US.UTF-8 (already relied upon -
# real testing showed it already active as the system LANG) and
# de_DE.UTF-8 (needed for German-keyboard-adjacent correctness, e.g.
# collation/sorting of German filenames) declaratively, but do NOT
# change /etc/locale.conf's LANG - this project's interface language
# stays whatever it already is; picking a German keyboard layout must
# not silently also force German UI/date/number formats (see
# roles/hyprland's hyprland_keyboard_layout for the actual Wayland
# keyboard layout setting).
- name: Ensure required locales are generated
  become: true
  community.general.locale_gen:
    name: "{{ item }}"
    state: present
  loop:
    - en_US.UTF-8
    - de_DE.UTF-8
  tags: base

# A UTF-8 system locale must EXIST, or the session and its D-Bus/systemd
# activated apps get none: systemd (PID 1 and the user manager - the
# D-Bus activation environment) takes LANG only from /etc/locale.conf,
# while a login shell / Ly's setup.sh fall back to C.UTF-8 on their own -
# two different locales in one session (Qt then warns 'Detected locale
# "C"'). Only a MISSING LANG is filled in (base_default_lang, generated
# above); a LANG the system already has is never changed - same
# conservative rule as above. Takes effect at the next boot/login.
- name: Read the system LANG
  ansible.builtin.command: grep -sx 'LANG=.\+' /etc/locale.conf
  register: base_locale_conf
  changed_when: false
  failed_when: base_locale_conf.rc > 2
  check_mode: false
  tags: base

- name: Ensure a system LANG exists (only if none is set)
  become: true
  when: base_locale_conf.rc != 0
  ansible.builtin.lineinfile:
    path: /etc/locale.conf
    line: "LANG={{ base_default_lang }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  tags: base

# Virtual console (TTY, pre-Hyprland) keymap - separate from Hyprland's
# own Wayland input.kb_layout (roles/hyprland), which only applies once
# a graphical session is running. de-latin1 is the Arch-documented
# German console keymap (preferred over plain "de" for its Latin-1
# dead-key support) - this machine is primarily used with a German
# keyboard (see roles/hyprland/defaults/main.yml
# hyprland_keyboard_layout).
- name: Configure German virtual console keymap
  become: true
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: '^KEYMAP='
    line: 'KEYMAP=de-latin1'
    create: true
    owner: root
    group: root
    mode: "0644"
  tags: base
