---
# Re-applies all of sysctl.d (systemd's own loader) - no reboot needed.
- name: Apply sysctl settings
  become: true
  ansible.builtin.systemd_service:
    name: systemd-sysctl.service
    state: restarted

# Replaces only the table inet workstation and refills the sharing rules
# (ExecReload); established connections (this SSH session) stay accepted.
- name: Reload the firewall
  when: firewall_nft.rc == 0
  become: true
  ansible.builtin.systemd_service:
    name: workstation-firewall.service
    state: reloaded
    daemon_reload: true
