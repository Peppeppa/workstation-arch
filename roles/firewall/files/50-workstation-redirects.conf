# Managed by Ansible (roles/firewall) - do not edit by hand.
# Do not accept ICMP redirects (a LAN host rewriting this machine's routes,
# e.g. on public Wi-Fi). all + default + every existing interface (the glob,
# also applied by systemd's udev rule to interfaces that appear later).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.*.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.*.accept_redirects = 0
