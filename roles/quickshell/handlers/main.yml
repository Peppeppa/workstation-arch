---
# A config change notifies this handler, which runs once at the end of
# the play - after every file is in place, so the reload never sees a
# half-deployed config. It asks the running Quickshell to reload over its
# own IPC (`shell.reload` -> Quickshell.reload(), shell.qml.j2): its file
# watcher is not reliable for deploys (arch-dev: Ansible's atomic replace
# went unnoticed; laptop 2026-10-06: even a touched shell.qml was ignored).
# An instance started from an older config has no `shell` target yet - for
# that one, the old touch is the fallback. Skipped when the restart below
# follows anyway (new QML files): reloading a config with a type the
# running instance does not know yet logs 'X is not a type' (laptop) -
# the restart loads it cleanly. Harmless if Quickshell isn't running. No
# process, no watcher of ours.
- name: Reload running Quickshell config
  when: not (quickshell_new_qml is defined and quickshell_new_qml is changed)
  ansible.builtin.shell:
    cmd: |
      qs ipc --any-display call shell reload >/dev/null 2>&1 \
        || touch "{{ ansible_facts.user_dir }}/.config/quickshell/shell.qml"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
  changed_when: true

# A restart (not a reload) for changes a running process cannot pick up,
# e.g. newly installed Qt image plugins. Runs after the reload above.
- name: Restart running Quickshell
  ansible.builtin.shell:
    cmd: |
      set -eu
      {{ quickshell_restart_script }}
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.user_uid }}/bus"
