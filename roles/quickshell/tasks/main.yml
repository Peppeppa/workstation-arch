---
# The once-per-run package database sync + full system upgrade lives in
# local.yml's pre_tasks (tags: always), not here - this role only
# ensures its own package/config are present.
- name: Install Quickshell
  become: true
  community.general.pacman:
    name: "{{ quickshell_packages }}"
    state: present
  tags: quickshell

# Everything below is user-level configuration and intentionally has no
# `become`: it must be owned by the normal user who ran bootstrap.sh,
# never root - same pattern as roles/hyprland. ansible_facts.user_*
# reflect that invoking user, gathered once at the start of the play
# before any become escalation happens.

- name: Ensure ~/.config/quickshell exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/quickshell"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: quickshell

# Fonts.qml is templated (unlike the rest of the core files) because the
# font names come from group_vars/all.yml desktop_*_font_family.
- name: Deploy the Quickshell font singleton (Fonts.qml)
  ansible.builtin.template:
    src: Fonts.qml.j2
    dest: "{{ ansible_facts.user_dir }}/.config/quickshell/Fonts.qml"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  notify: Reload running Quickshell config
  tags: quickshell

# Plain copy, not a template: none of these .qml files have
# host-specific values to substitute at this milestone (unlike
# hyprland.lua.j2's per-host scale/modifier/layout), and copying avoids
# any ambiguity between QML's own brace syntax and Jinja2's. `src`
# ends in `/` so the contents of files/quickshell/ (Bar.qml,
# Launcher.qml, and the color system Colors.qml/ColorScheme.qml/
# DefaultDark.qml - see docs/DESIGN_SYSTEM.md) land directly in
# ~/.config/quickshell/, not nested under an extra quickshell/
# subdirectory. shell.qml itself is templated below (it composes the
# optional features), and feature components live outside this
# directory so a disabled feature's file is never deployed.
- name: Deploy the Quickshell Core Desktop v1 config
  ansible.builtin.copy:
    src: quickshell/
    dest: "{{ ansible_facts.user_dir }}/.config/quickshell/"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  notify: Reload running Quickshell config
  tags: quickshell

# FEATURE: power_menu (see group_vars/all.yml power_menu_enabled and
# docs/feature-architecture.md). Disabling stops these tasks and drops
# the component from shell.qml + the Hyprland bind; an already-deployed
# PowerMenu.qml is left in place but no longer referenced (Disable vs.
# Purge - nothing is deleted).
- name: Install power menu packages (power_menu_enabled)
  when: power_menu_enabled
  become: true
  community.general.pacman:
    name: "{{ power_menu_packages }}"
    state: present
  tags: quickshell

# Hibernate is a host capability (swap large enough + resume configured),
# so it is asked from logind - the same authority `systemctl hibernate`
# goes through - once per provisioning run, per host, and baked into
# shell.qml. Nothing checks at runtime. "na"/"no" (or a failed query)
# hide the menu entry; "yes"/"challenge" (challenge = allowed after
# polkit auth, typical when bootstrap.sh runs outside the active seat
# session) show it. A host that gains working hibernate later picks it
# up on its next bootstrap.sh run.
- name: Query logind hibernate capability (power_menu_enabled)
  when: power_menu_enabled
  ansible.builtin.command:
    cmd: busctl call org.freedesktop.login1 /org/freedesktop/login1 org.freedesktop.login1.Manager CanHibernate
  register: power_menu_can_hibernate
  changed_when: false
  failed_when: false
  check_mode: false
  tags: quickshell

- name: Record hibernate availability for the power menu (power_menu_enabled)
  when: power_menu_enabled
  ansible.builtin.set_fact:
    power_menu_hibernate_available: >-
      {{ power_menu_can_hibernate.rc == 0 and
         power_menu_can_hibernate.stdout | trim in ['s "yes"', 's "challenge"'] }}
  tags: quickshell

- name: Deploy the power menu component (power_menu_enabled)
  when: power_menu_enabled
  ansible.builtin.copy:
    src: PowerMenu.qml
    dest: "{{ ansible_facts.user_dir }}/.config/quickshell/PowerMenu.qml"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  notify: Reload running Quickshell config
  tags: quickshell

# FEATURE: notifications (see group_vars/all.yml notifications_enabled).
# No packages: Quickshell itself is the daemon. Disabling drops the
# component from shell.qml (no D-Bus owner at all then); an already-
# deployed Notifications.qml stays unreferenced (Disable vs. Purge).
- name: Deploy the notifications component (notifications_enabled)
  when: notifications_enabled
  ansible.builtin.copy:
    src: Notifications.qml
    dest: "{{ ansible_facts.user_dir }}/.config/quickshell/Notifications.qml"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  notify: Reload running Quickshell config
  tags: quickshell

# Last on purpose: should Quickshell's watcher pick up a change mid-run
# anyway, the root file that references feature components goes in only
# after those components exist (avoids a reload against a missing type).
# The reliable reload is the handler (handlers/main.yml).
- name: Deploy the Quickshell root config (shell.qml)
  ansible.builtin.template:
    src: shell.qml.j2
    dest: "{{ ansible_facts.user_dir }}/.config/quickshell/shell.qml"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  notify: Reload running Quickshell config
  tags: quickshell

# Quickshell keeps a NotificationServer's D-Bus name across config
# reloads (confirmed on arch-dev: after disabling, the reloaded instance
# still owned org.freedesktop.Notifications and silently swallowed
# notifications). So when the feature is off but Quickshell still holds
# the name, restart it - again exec'd by the running Hyprland, so the
# lifecycle owner stays Hyprland. No-op otherwise (idempotent).
- name: Release org.freedesktop.Notifications held by Quickshell (notifications disabled)
  when: not notifications_enabled
  ansible.builtin.shell:
    cmd: |
      set -eu
      owner="$(busctl --user status org.freedesktop.Notifications 2>/dev/null | sed -n 's/^Comm=//p' || true)"
      if [ "$owner" != "quickshell" ]; then echo unchanged; exit 0; fi
      sig="$(hyprctl instances -j 2>/dev/null | python3 -c 'import json, sys; d = json.load(sys.stdin); print(d[0]["instance"] if d else "")' 2>/dev/null || true)"
      if [ -z "$sig" ]; then echo no-session; exit 0; fi
      pkill -u "$(id -u)" -x quickshell || true
      timeout 5 sh -c 'while pgrep -u "$(id -u)" -x quickshell >/dev/null; do sleep 0.1; done'
      hyprctl -i "$sig" dispatch 'hl.dsp.exec_cmd("{{ hyprland_quickshell_cmd }}")' >/dev/null
      echo restarted
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.user_uid }}/bus"
  register: notifications_release
  changed_when: notifications_release.stdout == "restarted"
  tags: quickshell

