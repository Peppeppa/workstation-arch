---
# The once-per-run package database sync + full system upgrade lives in
# local.yml's pre_tasks (tags: always), not here - this role only
# ensures its own package/config are present.
- name: Install Quickshell
  become: true
  community.general.pacman:
    name: "{{ quickshell_packages }}"
    state: present
  tags: quickshell

# Everything below is user-level configuration and intentionally has no
# `become`: it must be owned by the normal user who ran bootstrap.sh,
# never root - same pattern as roles/hyprland. ansible_facts.user_*
# reflect that invoking user, gathered once at the start of the play
# before any become escalation happens.

- name: Ensure ~/.config/quickshell exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/quickshell"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: quickshell

# Fonts.qml is templated (unlike the rest of the core files) because the
# font names come from group_vars/all.yml desktop_*_font_family.
- name: Deploy the Quickshell font singleton (Fonts.qml)
  ansible.builtin.template:
    src: Fonts.qml.j2
    dest: "{{ ansible_facts.user_dir }}/.config/quickshell/Fonts.qml"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  notify: Reload running Quickshell config
  tags: quickshell

# Plain copy, not a template (avoids any ambiguity between QML's braces
# and Jinja2's). `src` ends in `/`: the contents of files/quickshell/
# (Colors, Launcher, CoffeeMode, ..., and the bar/ tree: bar host, layout,
# popup coordinator, common components, core widgets) land directly in
# ~/.config/quickshell/. shell.qml and bar/BarFeatures.qml are templated
# below; feature components live outside this directory and are copied
# into their widget's directory only while enabled.
- name: Deploy the Quickshell core config (incl. the bar)
  ansible.builtin.copy:
    src: quickshell/
    dest: "{{ ansible_facts.user_dir }}/.config/quickshell/"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  notify: Reload running Quickshell config
  tags: quickshell

# Which optional bar parts this host has (the <name>_enabled flags).
- name: Deploy the bar feature switches (bar/BarFeatures.qml)
  ansible.builtin.template:
    src: BarFeatures.qml.j2
    dest: "{{ ansible_facts.user_dir }}/.config/quickshell/bar/BarFeatures.qml"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  notify: Reload running Quickshell config
  tags: quickshell

# The bar layout is runtime user state (drag & drop in the bar writes it).
# Ansible only creates it from the shipped default when it does not exist
# yet - an existing layout is never touched (force: false).
- name: Ensure ~/.config/workstation exists
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/workstation"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: quickshell

- name: Create the default bar layout if none exists
  ansible.builtin.copy:
    src: quickshell/bar/default-layout.json
    dest: "{{ ansible_facts.user_dir }}/.config/workstation/bar-layout.json"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
    force: false
  tags: quickshell

# FEATURE: power_menu (see group_vars/all.yml power_menu_enabled and
# docs/feature-architecture.md). Disabling stops these tasks and drops
# the component from shell.qml + the Hyprland bind; an already-deployed
# PowerMenu.qml is left in place but no longer referenced (Disable vs.
# Purge - nothing is deleted).
- name: Install power menu packages (power_menu_enabled)
  when: power_menu_enabled
  become: true
  community.general.pacman:
    name: "{{ power_menu_packages }}"
    state: present
  tags: quickshell

# Hibernate is a host capability (swap large enough + resume configured),
# so it is asked from logind - the same authority `systemctl hibernate`
# goes through - once per provisioning run, per host, and baked into
# shell.qml. Nothing checks at runtime. "na"/"no" (or a failed query)
# hide the menu entry; "yes"/"challenge" (challenge = allowed after
# polkit auth, typical when bootstrap.sh runs outside the active seat
# session) show it. A host that gains working hibernate later picks it
# up on its next bootstrap.sh run.
- name: Query logind hibernate capability (power_menu_enabled)
  when: power_menu_enabled
  ansible.builtin.command:
    cmd: busctl call org.freedesktop.login1 /org/freedesktop/login1 org.freedesktop.login1.Manager CanHibernate
  register: power_menu_can_hibernate
  changed_when: false
  failed_when: false
  check_mode: false
  tags: quickshell

- name: Record hibernate availability for the power menu (power_menu_enabled)
  when: power_menu_enabled
  ansible.builtin.set_fact:
    power_menu_hibernate_available: >-
      {{ power_menu_can_hibernate.rc == 0 and
         power_menu_can_hibernate.stdout | trim in ['s "yes"', 's "challenge"'] }}
  tags: quickshell

- name: Deploy the power menu component (power_menu_enabled)
  when: power_menu_enabled
  ansible.builtin.copy:
    src: PowerMenu.qml
    dest: "{{ ansible_facts.user_dir }}/.config/quickshell/PowerMenu.qml"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  notify: Reload running Quickshell config
  tags: quickshell

# FEATURE: notifications (see group_vars/all.yml notifications_enabled).
# No packages: Quickshell itself is the daemon. Disabling drops the
# component from shell.qml (no D-Bus owner at all then); an already-
# deployed Notifications.qml stays unreferenced (Disable vs. Purge).
- name: Deploy the notifications component (notifications_enabled)
  when: notifications_enabled
  ansible.builtin.copy:
    src: Notifications.qml
    dest: "{{ ansible_facts.user_dir }}/.config/quickshell/Notifications.qml"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  notify: Reload running Quickshell config
  tags: quickshell

# FEATURE: tray (see group_vars/all.yml tray_enabled). No packages:
# Quickshell's own StatusNotifier support is the tray host. Disabling
# keeps the bar from loading it (no watcher/host from us); already-
# deployed files stay unreferenced (Disable vs. Purge).
- name: Deploy the tray components (tray_enabled)
  when: tray_enabled
  ansible.builtin.copy:
    src: tray/
    dest: "{{ ansible_facts.user_dir }}/.config/quickshell/bar/widgets/Tray/"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  notify: Reload running Quickshell config
  tags: quickshell

# FEATURE: bluetooth (see group_vars/all.yml bluetooth_enabled; the
# service side is roles/bluetooth). Bar widget + popup into
# bar/widgets/Bluetooth/, the on-demand pairing agent into
# ~/.local/libexec/workstation/.
- name: Deploy the Bluetooth components (bluetooth_enabled)
  when: bluetooth_enabled
  ansible.builtin.copy:
    src: "bluetooth/{{ item }}"
    dest: "{{ ansible_facts.user_dir }}/.config/quickshell/bar/widgets/Bluetooth/"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  loop:
    - Widget.qml
    - Popup.qml
  notify: Reload running Quickshell config
  tags: quickshell

- name: Ensure ~/.local/libexec/workstation exists (bluetooth_enabled)
  when: bluetooth_enabled
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.local/libexec/workstation"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: quickshell

- name: Deploy the Bluetooth pairing agent (bluetooth_enabled)
  when: bluetooth_enabled
  ansible.builtin.copy:
    src: bluetooth/bluetooth-agent.py
    dest: "{{ ansible_facts.user_dir }}/.local/libexec/workstation/bluetooth-agent"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: quickshell

# FEATURE: audio_popup (see group_vars/all.yml audio_popup_enabled). No
# packages: PipeWire/WirePlumber are core (roles/audio).
- name: Deploy the audio popup components (audio_popup_enabled)
  when: audio_popup_enabled
  ansible.builtin.copy:
    src: audio/
    dest: "{{ ansible_facts.user_dir }}/.config/quickshell/bar/widgets/Audio/"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  notify: Reload running Quickshell config
  tags: quickshell

# FEATURE: connectivity (see group_vars/all.yml connectivity_enabled).
# NetworkManager stays the only network owner (roles/network). qrencode +
# python-gobject for the on-demand Wi-Fi QR helper.
- name: Install connectivity packages (connectivity_enabled)
  when: connectivity_enabled
  become: true
  community.general.pacman:
    name: "{{ connectivity_packages }}"
    state: present
  tags: quickshell

- name: Deploy the Connectivity Center components (connectivity_enabled)
  when: connectivity_enabled
  ansible.builtin.copy:
    src: connectivity/Popup.qml
    dest: "{{ ansible_facts.user_dir }}/.config/quickshell/bar/widgets/Connectivity/Popup.qml"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  notify: Reload running Quickshell config
  tags: quickshell

- name: Ensure ~/.local/libexec/workstation exists (connectivity_enabled)
  when: connectivity_enabled
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.local/libexec/workstation"
    state: directory
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: quickshell

- name: Deploy the Wi-Fi QR helper (connectivity_enabled)
  when: connectivity_enabled
  ansible.builtin.copy:
    src: connectivity/wifi-qr.py
    dest: "{{ ansible_facts.user_dir }}/.local/libexec/workstation/wifi-qr"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0755"
  tags: quickshell

# FEATURE: clipboard_history (see group_vars/all.yml
# clipboard_history_enabled; cliphist + the watcher are roles/hyprland).
- name: Deploy the clipboard history popup (clipboard_history_enabled)
  when: clipboard_history_enabled
  ansible.builtin.copy:
    src: clipboard/ClipboardHistory.qml
    dest: "{{ ansible_facts.user_dir }}/.config/quickshell/ClipboardHistory.qml"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  notify: Reload running Quickshell config
  tags: quickshell

# FEATURE: wallpaper (see group_vars/all.yml wallpaper_enabled). The
# images are the themes' backgrounds/ (roles/theme); the choice is runtime
# state of the `theme` helper - nothing here touches it.
- name: Install wallpaper packages (wallpaper_enabled)
  when: wallpaper_enabled
  become: true
  community.general.pacman:
    name: "{{ wallpaper_packages }}"
    state: present
  # Qt lists its image plugins once per process: a running Quickshell only
  # sees newly installed formats (WebP) after a restart.
  notify: Restart running Quickshell
  tags: quickshell

- name: Deploy the wallpaper components (wallpaper_enabled)
  when: wallpaper_enabled
  ansible.builtin.copy:
    src: "wallpaper/{{ item.src }}"
    dest: "{{ ansible_facts.user_dir }}/.config/quickshell/{{ item.dest }}"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  loop:
    - { src: Wallpaper.qml, dest: Wallpaper.qml }
    - { src: WallpaperPicker.qml, dest: bar/widgets/Theme/WallpaperPicker.qml }
  notify: Reload running Quickshell config
  tags: quickshell

# Last on purpose: should Quickshell's watcher pick up a change mid-run
# anyway, the root file that references feature components goes in only
# after those components exist (avoids a reload against a missing type).
# The reliable reload is the handler (handlers/main.yml).
- name: Deploy the Quickshell root config (shell.qml)
  ansible.builtin.template:
    src: shell.qml.j2
    dest: "{{ ansible_facts.user_dir }}/.config/quickshell/shell.qml"
    owner: "{{ ansible_facts.user_id }}"
    group: "{{ ansible_facts.user_gid }}"
    mode: "0644"
  notify: Reload running Quickshell config
  tags: quickshell

# Ansible-owned core files that no longer exist, not user data - removed
# (only after shell.qml is in place, so a running Quickshell never reloads
# a shell.qml that still references a removed file)
# so nothing stale lingers (a stale root-level Bar.qml etc. would even
# shadow the new bar/ types):
# - Central Color System v1 scheme files (superseded by themes/)
# - the pre-RICE flat bar + feature components (now bar/ and
#   bar/widgets/<Widget>/, RICE v1)
# - the standalone launcher (now the OS menu's Applications page, osmenu/)
- name: Remove retired Quickshell files
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.config/quickshell/{{ item }}"
    state: absent
  loop:
    - ColorScheme.qml
    - DefaultDark.qml
    - Bar.qml
    - BatteryIndicator.qml
    - ThemeDialog.qml
    - Tray.qml
    - TrayMenu.qml
    - TrayMenuLevel.qml
    - BluetoothButton.qml
    - BluetoothPopup.qml
    - PowerControl.qml
    - PowerPopup.qml
    - AudioControl.qml
    - AudioPopup.qml
    - ConnectivityControl.qml
    - ConnectivityPopup.qml
    - WallpaperPicker.qml
    - Launcher.qml
  notify: Reload running Quickshell config
  tags: quickshell

# Quickshell keeps D-Bus names it once claimed across config reloads -
# confirmed on arch-dev for both features that own a name: after
# disabling notifications the reloaded instance still owned
# org.freedesktop.Notifications (and silently swallowed notifications);
# after disabling the tray it still owned org.kde.StatusNotifierWatcher
# (+ its StatusNotifierHost). So when a feature is off but Quickshell
# still holds that feature's name, restart Quickshell once - exec'd by
# the running Hyprland, so the lifecycle owner stays Hyprland. No-op
# otherwise (idempotent).
- name: Release D-Bus names of disabled Quickshell features
  vars:
    quickshell_released_names: >-
      {{ ([] if notifications_enabled else ['org.freedesktop.Notifications'])
         + ([] if tray_enabled else ['org.kde.StatusNotifierWatcher']) }}
  when: quickshell_released_names | length > 0
  ansible.builtin.shell:
    cmd: |
      set -eu
      held=""
      for name in {{ quickshell_released_names | join(' ') }}; do
        owner="$(busctl --user status "$name" 2>/dev/null | sed -n 's/^Comm=//p' || true)"
        if [ "$owner" = "quickshell" ]; then held="$held $name"; fi
      done
      if [ -z "$held" ]; then echo unchanged; exit 0; fi
      {{ quickshell_restart_script }}
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.user_uid }}/bus"
  register: quickshell_release
  changed_when: quickshell_release.stdout == "restarted"
  tags: quickshell

# Hyprland's session start owns Quickshell (roles/hyprland session.lua).
# Like hypridle: a bootstrap inside a running session where Quickshell is
# not running (crashed / stopped) asks THAT Hyprland to exec it. No-op
# without a session or with Quickshell up.
- name: Ensure Quickshell runs in the active Hyprland session
  ansible.builtin.shell:
    cmd: "{{ quickshell_start_script }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
  register: quickshell_start
  changed_when: quickshell_start.stdout == "started"
  tags: quickshell
