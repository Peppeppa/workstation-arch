---
# Quickshell foundation milestone: the smallest shell that proves
# install/config/lifecycle, not yet the full presentation layer (see
# docs/ARCHITECTURE.md). fuzzel/mako stay in roles/hyprland and
# roles/desktop for now - this role does not replace them yet.
quickshell_packages:
  # Official Arch `extra` repository (verified via `pacman -Si
  # quickshell` against a real upstream-Arch package database), not
  # AUR/Flatpak/a vendor channel - the Package Source Policy's #1
  # choice was genuinely available, no exception needed. Pulls Qt6/
  # QtQuick/qt6-wayland itself via pacman; nothing extra to declare
  # here.
  - quickshell

  # Real-VM-discovered bug: shell.qml's battery widget imports
  # Quickshell.Services.UPower, which talks to org.freedesktop.UPower
  # over D-Bus - quickshell's own pacman metadata lists no dependency
  # on upower at all (`pacman -Si quickshell` shows no Depends/Optional
  # entry for it: it is a pure runtime D-Bus client, not something
  # pacman pulls in for us), so without this the name is simply not
  # activatable and Quickshell logs
  # "Could not launch service org.freedesktop.UPower:
  # org.freedesktop.DBus.Error.ServiceUnknown". upower's own
  # upower.service is `Type=dbus`/`BusName=org.freedesktop.UPower`
  # with a matching /usr/share/dbus-1/system-services/
  # org.freedesktop.UPower.service (`SystemdService=upower.service`) -
  # standard D-Bus activation, exactly like rtkit-daemon.service (see
  # roles/audio). Installing the package is the entire fix; no enable/
  # start task is needed or correct here - D-Bus activates it on first
  # use regardless of `systemctl is-enabled` state.
  - upower

  # Visuals bar widget (core): Day/Night runs hyprsunset - hyprwm's own
  # blue-light filter (official `extra`), a child of Quickshell only while
  # Night is on (NightLight.qml); the timer's reminder sound is the
  # freedesktop sound theme's alarm-clock-elapsed (played with pw-play,
  # part of pipewire - roles/audio). No other night-light/timer daemon.
  - hyprsunset
  - sound-theme-freedesktop

# Files this role deployed once that no longer exist in it - removed from
# ~/.config/quickshell/ (the core copy only adds/updates, it never
# deletes). Coffee and Theme are one "visuals" widget now; the GTK-only
# text scale model became the desktop text size (theme helper).
quickshell_retired_files:
  - bar/widgets/Coffee
  - bar/widgets/Theme/Widget.qml
  - services/TextScaleModel.qml

# FEATURE: power_menu (see group_vars/all.yml power_menu_enabled).
# PowerMenu.qml draws its icons (Font Awesome codepoints) from the
# system Nerd Font (Fonts.icons). roles/desktop already installs it as
# the core system font; listed here too so the feature's dependency is
# explicit. No other packages: actions go through systemctl/logind and
# Hyprland, both core.
power_menu_packages:
  - ttf-firacode-nerd

# FEATURE: connectivity (see group_vars/all.yml connectivity_enabled).
# The Wi-Fi QR helper (files/connectivity/wifi-qr.py): python-gobject for
# NetworkManager's D-Bus API, qrencode for the SVG.
connectivity_packages:
  - python-gobject
  - qrencode

# FEATURE: wallpaper (see group_vars/all.yml wallpaper_enabled). PNG,
# JPEG and GIF are built into Qt; WebP needs the extra image plugins.
wallpaper_packages:
  - qt6-imageformats

# Internal: the desktop's Quickshell is the instance whose command line is
# exactly "quickshell" (default config; the env wrappers in
# hyprland_quickshell_exec exec into it). Instances started with -p/-c
# (e.g. test harnesses) are never touched.
quickshell_session_pids: pgrep -u "$(id -u)" -fx quickshell

# Internal: restarts the desktop Quickshell, exec'd by the running
# Hyprland (lifecycle owner stays Hyprland). Waits for exactly the old
# process(es) to exit. Prints "restarted", or "no-session".
quickshell_restart_script: |
  sig="$(hyprctl instances -j 2>/dev/null | python3 -c 'import json, sys; d = json.load(sys.stdin); print(d[0]["instance"] if d else "")' 2>/dev/null || true)"
  if [ -z "$sig" ]; then echo no-session; exit 0; fi
  pids="$({{ quickshell_session_pids }} || true)"
  if [ -n "$pids" ]; then
    kill $pids 2>/dev/null || true
    timeout 5 sh -c 'for p in "$@"; do while kill -0 "$p" 2>/dev/null; do sleep 0.1; done; done' sh $pids
  fi
  hyprctl -i "$sig" dispatch 'hl.dsp.exec_cmd("{{ hyprland_quickshell_exec }}")' >/dev/null
  echo restarted

# Internal: starts the desktop Quickshell in the running Hyprland session
# if it is not running (e.g. it crashed, or was stopped). Prints "started"
# only if it did.
quickshell_start_script: |
  if {{ quickshell_session_pids }} >/dev/null; then echo running; exit 0; fi
  sig="$(hyprctl instances -j 2>/dev/null | python3 -c 'import json, sys; d = json.load(sys.stdin); print(d[0]["instance"] if d else "")' 2>/dev/null || true)"
  if [ -z "$sig" ]; then echo no-session; exit 0; fi
  hyprctl -i "$sig" dispatch 'hl.dsp.exec_cmd("{{ hyprland_quickshell_exec }}")' >/dev/null
  echo started
