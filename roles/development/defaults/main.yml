---
# Development tooling (Daily Driver Polish). Official Arch packages only
# (`pacman -Si` checked 2026-10), ensure-present: removing a line never
# uninstalls anything. Project dependencies do NOT belong here - they go
# into per-project environments (uv / venv), not the system.
development_packages:
  # Git/GitHub (git itself: roles/base)
  - github-cli          # gh
  - lazygit             # terminal UI for git

  # Java: the current LTS JDK (25) for IntelliJ projects and the CLI.
  # jdk-openjdk would be the latest non-LTS release (27); IntelliJ can
  # still download/select other JDKs per project itself.
  - jdk25-openjdk

  # Python: the interpreter (core) + uv for virtual environments, project
  # dependencies and other Python versions. No global pip packages -
  # Arch's system Python is externally managed on purpose; `python -m venv`
  # is in the standard library.
  - python
  - uv

  # Docker Engine + Compose (CLI plugin, `docker compose`) + Buildx
  # (Compose builds images through it) + lazydocker (TUI). Containers,
  # images, volumes and databases are the user's - nothing is created
  # here.
  - docker
  - docker-compose
  - docker-buildx
  - lazydocker

  # MariaDB/MySQL command-line client only (`mariadb`, `mariadb-dump`,
  # ...; pulls mariadb-libs) - for databases that run elsewhere (a
  # container, a tunnel to 127.0.0.1:3306). Deliberately NOT the server
  # package `mariadb`: no local database server in the baseline.
  - mariadb-clients

  # LaTeX for .tex in Neovim -> PDF in Zathura (roles/apps), built with
  # latexmk. Single TeX Live collections, not the `texlive` group (~2.8 GiB
  # with music, ConTeXt, publisher classes ...) and not the `texlive-lang`
  # group (17 language collections) - German only. ~0.7 GiB installed.
  - texlive-bin             # engines: pdftex, luahbtex (pdflatex, lualatex)
  - texlive-basic           # plain TeX + the format/kpathsea base
  - texlive-latex           # LaTeX kernel + formats, article/report/book, amsmath, graphicx, hyperref
  - texlive-latexrecommended  # fontspec, xcolor, booktabs, ...
  - texlive-latexextra      # the usual extra packages (pulls texlive-pictures: TikZ)
  - texlive-fontsrecommended  # Latin Modern, TeX Gyre, the standard Type 1 fonts
  - texlive-langgerman      # babel ngerman + German hyphenation
  - texlive-mathscience     # math/science packages (siunitx, ...)
  - texlive-bibtexextra     # BibLaTeX and bibliography styles
  - biber                   # BibLaTeX backend
  - texlive-binextra        # latexmk (no separate Arch package) and other TeX helpers
  - texlive-luatex          # luaotfload - lualatex aborts without it

# Docker runs only on demand: neither the daemon nor its socket starts at
# boot (that is also Arch's package default - stated here so it stays
# so). Start: `sudo systemctl start docker`; stop everything again:
# `sudo systemctl stop docker.socket docker.service containerd.service`
# (README "Docker"). The socket is part of the stop: left listening, any
# `docker` call (or an IDE probing it) would start the daemon again.
development_docker_units:
  - docker.service
  - docker.socket
  - containerd.service

# Python / Data Science (README "Python / Data Science"): ONE global
# learning/course environment, declared in files/data-science/pyproject.toml
# and locked in uv.lock (exact versions + hashes). Bootstrap runs
# `uv sync --frozen --inexact` against the system Python (pacman's
# /usr/bin/python3, no uv-downloaded interpreter): nothing is resolved or
# downloaded again when the lock is unchanged; uv prepares every package
# before it touches the environment, so a failed download/build leaves it as
# it was; --inexact keeps packages the user added to it. Never --break-
# system-packages, no global pip, no conda/poetry/pipenv. Other projects get
# their own environment (`uv init`, `uv venv`) - this one is not injected.
development_ds_project: "{{ ansible_facts.user_dir }}/.local/share/workstation/data-science"
development_ds_venv: "{{ ansible_facts.user_dir }}/.local/share/venvs/data-science"
development_ds_kernel: data-science          # Jupyter kernel name
development_ds_kernel_display: "Python 3 (Data Science)"
